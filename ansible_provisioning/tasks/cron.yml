- name: Create startup folder
  ansible.builtin.file:
    path: "/cron"
    state: directory
  tags: cron

- name: Remove cron file scripts
  file:
    path: '{{item}}'
    state: absent
  with_items:
    - /cron/daily_job.sh
  tags: cron

- name: Create cron file sripts
  ansible.builtin.file:
    path: '{{item}}'
    state: touch
    mode: u+rw,g-wx,o-rwx
  with_items:
    - /cron/daily_job.sh
  tags: cron

- name: Make Scripts Executable
  file: dest={{item}} mode=a+x
  with_items:
    - /cron/daily_job.sh
  tags: cron

- name: Write Cron Job docker cleanup
  lineinfile: 
    dest: "/cron/daily_job.sh"
    line: '{{ item }}'
  with_items:
    - 'docker system prune -af'
  tags: cron

- name: Create Swarm Crontab entry for daily jobs
  ansible.builtin.cron:
    name: "Swarm job for docker image/volume cleanup"
    special_time: daily
    job: "bash /cron/daily_job.sh /cron/daily_job.log 2>&1"
  tags: cron

- name: Create the pull_pt_data.sh script
  copy:
    dest: "/mnt/plex_smb_share/iptv/XML-EPG-DATA/scripts/pull_pt_data.sh"
    content: |
      #!/bin/bash

      # Variables
      DOWNLOAD_URL="https://epgshare01.online/epgshare01/epg_ripper_PT1.xml.gz"
      DOWNLOAD_DIR="/mnt/plex_smb_share/iptv/XML-EPG-DATA"
      FILENAME="epg_ripper_PT1.xml.gz"

      # Function to check if the required tools are installed
      check_dependencies() {
          if ! command -v wget &> /dev/null; then
              echo "Error: wget is not installed. Please install it and try again."
              exit 1
          fi

          if ! command -v gunzip &> /dev/null; then
              echo "Error: gunzip is not installed. Please install it and try again."
              exit 1
          fi
      }

      # Main script
      check_dependencies

      echo "Creating download directory if it doesn't exist..."
      mkdir -p "$DOWNLOAD_DIR"

      echo "Downloading $FILENAME..."
      wget -q --show-progress -O "$DOWNLOAD_DIR/$FILENAME" "$DOWNLOAD_URL"

      if [[ $? -ne 0 ]]; then
          echo "Error: Failed to download the file."
          exit 1
      fi

      echo "Extracting $FILENAME to $DOWNLOAD_DIR..."
      gunzip -f "$DOWNLOAD_DIR/$FILENAME"

      if [[ $? -ne 0 ]]; then
          echo "Error: Failed to extract the file."
          exit 1
      fi

      echo "File successfully downloaded and extracted to $DOWNLOAD_DIR."
  tags: cron


- name: Create the cron job to run pull_pt_data.sh daily at midnight
  cron:
    name: "Get PT IPTV EPG Data Daily"
    minute: "10"
    hour: "5"
    job:  "PATH=/usr/local/bin:/usr/bin:/bin bash /mnt/plex_smb_share/iptv/XML-EPG-DATA/scripts/pull_pt_data.sh /mnt/plex_smb_share/iptv/XML-EPG-DATA/scripts/pull_pt_data.log 2>&1"
    state: present
  tags: cron