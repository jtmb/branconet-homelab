- name: Build valid node list
  set_fact:
    all_nodes: "{{ (groups['master_nodes'] + groups['worker_nodes']) | select('match', '^[a-zA-Z0-9_.-]+$') | list }}"

- name: Build all IP/hostname combinations for round-robin DNS
  set_fact:
    rr_dns_list: "{{ all_nodes | product(dns_list) | list }}"

- name: Render rr_dns_list to hosts array format (multi-line, all entries)
  set_fact:
    dns_hosts_array: |
      [
      {% for pair in rr_dns_list %}
        "{{ hostvars[pair[0]].ansible_default_ipv4.address }} {{ pair[1].domain | regex_replace(',','') }}"{% if not loop.last %},{% endif %}
      {% endfor %}
      ]

- name: Replace hosts array in config file (multi-line block)
  replace:
    path: "{{ container_volumes_location }}/pihole/pihole.toml"
    regexp: 'hosts\s*=\s*\[[^\]]*\]'
    replace: 'hosts = {{ dns_hosts_array }}'
    backup: yes