---
# Flux bootstrap config — points Flux at this repo.
# Applied once during bootstrap, then Flux manages itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s-rewrite/charts
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/jtmb/branconet-homelab.git
  ref:
    branch: k8s-rewrite
