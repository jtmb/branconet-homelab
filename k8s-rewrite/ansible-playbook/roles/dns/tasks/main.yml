---
- name: Configure two CoreDNS replicas
  ansible.builtin.command: "kubectl -n kube-system scale deployment/coredns --replicas={{ coredns_replicas }}"
  changed_when: true

- name: Verify DNS rollout readiness
  ansible.builtin.command: kubectl -n kube-system rollout status deployment/coredns --timeout=300s
  changed_when: false
