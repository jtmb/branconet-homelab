---
- name: Resolve the accepted native Pi-hole service address
  ansible.builtin.command: kubectl -n pihole get service pihole -o json
  register: native_dns_service
  changed_when: false
  when: migration_native_dns_enabled | bool

- name: Render the actual CoreDNS public and conditional LAN forwarding
  ansible.builtin.copy:
    dest: /etc/kubernetes/coredns-migration.yaml
    mode: '0644'
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
        namespace: kube-system
      data:
        Corefile: |
          .:53 {
              errors
              health {
                  lameduck 5s
              }
              ready
              kubernetes cluster.local in-addr.arpa ip6.arpa {
                  pods insecure
                  fallthrough in-addr.arpa ip6.arpa
                  ttl 30
              }
              prometheus :9153
              forward . {{ cluster_upstream_dns | join(' ') }} {
                  max_concurrent 1000
              }
              cache 30 {
                  disable success cluster.local
                  disable denial cluster.local
              }
              loop
              reload
              loadbalance
          }
          branconet.lan:53 {
              errors
              cache 30
              forward . {{ (native_dns_service.stdout | from_json).spec.clusterIP }}
          }
          branconet.local:53 {
              errors
              cache 30
              forward . {{ (native_dns_service.stdout | from_json).spec.clusterIP }}
          }
  when: migration_native_dns_enabled | bool

- name: Apply accepted native DNS forwarding
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/coredns-migration.yaml
  changed_when: true
  when: migration_native_dns_enabled | bool

- name: Configure two CoreDNS replicas
  ansible.builtin.command: "kubectl -n kube-system scale deployment/coredns --replicas={{ coredns_replicas }}"
  changed_when: true

- name: Verify DNS rollout readiness
  ansible.builtin.command: kubectl -n kube-system rollout status deployment/coredns --timeout=300s
  changed_when: false
