---
- name: Install the pinned Flux controllers including Helm
  ansible.builtin.command: "kubectl apply --server-side -f https://github.com/fluxcd/flux2/releases/download/{{ flux_version }}/install.yaml"
  changed_when: true

- name: Require essential deployment controllers Ready
  ansible.builtin.command: "kubectl -n flux-system rollout status deployment/{{ item }} --timeout=300s"
  changed_when: false
  loop: [source-controller, kustomize-controller, helm-controller, notification-controller]

# Git source activation follows validated chart commits. Do not reconcile the old
# branch's incomplete manifests over staged migration datasets.
- name: Record controllers for migration acceptance
  ansible.builtin.command: kubectl -n flux-system get deployments -o json
  changed_when: false

- name: Require the independently restored native source credential before activation
  ansible.builtin.command: "kubectl -n flux-system get secret {{ flux_git_secret_name }} -o name"
  changed_when: false
  when: flux_activation_enabled | bool

- name: Activate the validated charts source after native state recovery
  ansible.builtin.copy:
    dest: /etc/kubernetes/flux-migration-bootstrap.yaml
    mode: '0644'
    content: |
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: {{ flux_git_source_name }}
        namespace: flux-system
      spec:
        interval: 1m
        url: {{ flux_git_url }}
        ref:
          branch: {{ flux_git_branch }}
        secretRef:
          name: {{ flux_git_secret_name }}
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: migration-releases
        namespace: flux-system
      spec:
        interval: 1m
        timeout: 10m
        path: {{ flux_git_path }}
        prune: false
        force: false
        wait: true
        sourceRef:
          kind: GitRepository
          name: {{ flux_git_source_name }}
  when: flux_activation_enabled | bool

- name: Apply validated-source activation
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/flux-migration-bootstrap.yaml
  changed_when: true
  when: flux_activation_enabled | bool
