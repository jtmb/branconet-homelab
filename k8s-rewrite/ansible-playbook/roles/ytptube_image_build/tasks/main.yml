---
- name: Require the exact reviewed isolated build scope
  ansible.builtin.assert:
    that:
      - ytptube_build_apply | bool
      - inventory_hostname == 'masternode'
      - ytptube_build_phase in ['setup', 'runtime', 'status', 'stop']
      - ytptube_build_root == '/home/james/.local/share/branconet-migration/ytptube-build-20261023'
      - ytptube_build_unit_prefix == 'bortus-ytptube-build-20261023'
      - ytptube_build_archive_sha256 == 'a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b'
    fail_msg: Only the reviewed master-only standalone builder scope is supported.

- name: Refuse further builds on production storage
  ansible.builtin.assert:
    that:
      - ytptube_build_phase in ['status', 'stop']
    fail_msg: Production disks lack the reviewed build reserve. This prepared October 23 builder permits inspection and stopping only; use the reviewed off-cluster image-build workflow.

- name: Inspect the existing protected build identity
  ansible.builtin.stat:
    path: "{{ ytptube_build_root }}/build-inputs.json"
  register: ytptube_build_seal

- name: Set up isolated verified build inputs
  ansible.builtin.include_tasks: setup.yml
  when: ytptube_build_phase == 'setup'

- name: Require sealed setup for operational phases
  ansible.builtin.assert:
    that: [ytptube_build_seal.stat.exists]
    fail_msg: Complete and review setup before selecting runtime/status/stop.
  when: ytptube_build_phase != 'setup'

- name: Dispatch one bounded asynchronous build phase
  ansible.builtin.command:
    argv:
      - systemd-run
      - "--unit={{ ytptube_build_unit_prefix }}-{{ ytptube_build_phase }}"
      - --property=Type=exec
      - --property=MemoryMax=3221225472
      - --property=MemorySwapMax=0
      - --property=CPUQuota=150%
      - --property=AllowedCPUs=0-1
      - --property=TasksMax=512
      - --property=Delegate=yes
      - --property=KillMode=control-group
      - --property=TimeoutStopSec=45
      - --property=RuntimeMaxSec=14400
      - --property=UMask=0077
      - "--property=StandardOutput=append:{{ ytptube_build_root }}/{{ ytptube_build_phase }}-unit.log"
      - "--property=StandardError=append:{{ ytptube_build_root }}/{{ ytptube_build_phase }}-unit.log"
      - --
      - /usr/bin/python3
      - "{{ ytptube_build_root }}/build_phase.py"
      - "{{ ytptube_build_phase }}"
      - "{{ ytptube_build_root }}"
      - "{{ ytptube_build_unit_prefix }}"
  changed_when: true
  when: ytptube_build_phase == 'runtime'

- name: Report only bounded unit and retained artifact metadata
  ansible.builtin.command:
    argv: [/usr/bin/python3, "{{ ytptube_build_root }}/build_phase.py", status, "{{ ytptube_build_root }}", "{{ ytptube_build_unit_prefix }}"]
  changed_when: false
  register: ytptube_build_status
  when: ytptube_build_phase in ['status', 'runtime']

- name: Show sanitized builder status metadata
  ansible.builtin.debug:
    msg: "{{ ytptube_build_status.stdout | from_json }}"
  when: ytptube_build_phase in ['status', 'runtime']

- name: Stop only this isolated builder's exact runtime unit
  ansible.builtin.command:
    argv: [/usr/bin/python3, "{{ ytptube_build_root }}/build_phase.py", stop, "{{ ytptube_build_root }}", "{{ ytptube_build_unit_prefix }}"]
  changed_when: true
  register: ytptube_build_stop
  when: ytptube_build_phase == 'stop'

- name: Show exact owned unit after stopping
  ansible.builtin.debug:
    msg: "{{ ytptube_build_stop.stdout | from_json }}"
  when: ytptube_build_phase == 'stop'
