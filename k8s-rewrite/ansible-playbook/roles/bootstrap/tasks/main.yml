---
- name: Check the existing Gluster data directory is retained
  ansible.builtin.stat:
    path: /gluster/volumes
  register: gluster_brick

- name: Require the discovered platform and retained data
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
      - ansible_facts['distribution'] == 'Ubuntu'
      - gluster_brick.stat.isdir | default(false)
    fail_msg: Platform or Gluster source changed; stop and reinventory.

- name: Install Kubernetes and Longhorn prerequisites without replacing Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, conntrack, socat, iptables, ipset, open-iscsi, nfs-common, cryptsetup, jq, cifs-utils]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create independent runtime and CNI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/opt/containerd-k8s, /opt/containerd-k8s/bin, /opt/cni/bin, /etc/containerd-k8s, /etc/cni/net.d, /var/lib/containerd-k8s, /var/cache/branconet-migration]

- name: Download checksum-verified independent runtime archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "/var/cache/branconet-migration/{{ item.name }}"
    mode: '0644'
  loop:
    - name: containerd.tar.gz
      url: "https://github.com/containerd/containerd/releases/download/{{ containerd_version }}/containerd-static-{{ containerd_version | regex_replace('^v', '') }}-linux-amd64.tar.gz"
      sha256: "{{ containerd_sha256 }}"
    - name: cni.tar.gz
      url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_version }}/cni-plugins-linux-amd64-{{ cni_version }}.tgz"
      sha256: "{{ cni_sha256 }}"
    - name: crictl.tar.gz
      url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
      sha256: "{{ crictl_sha256 }}"

- name: Extract the independent runtime
  ansible.builtin.unarchive:
    src: /var/cache/branconet-migration/containerd.tar.gz
    dest: /opt/containerd-k8s
    remote_src: true
    creates: /opt/containerd-k8s/bin/containerd

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: /var/cache/branconet-migration/cni.tar.gz
    dest: /opt/cni/bin
    remote_src: true
    creates: /opt/cni/bin/bridge

- name: Extract isolated CRI diagnostic client
  ansible.builtin.unarchive:
    src: /var/cache/branconet-migration/crictl.tar.gz
    dest: /opt/containerd-k8s/bin
    remote_src: true
    creates: /opt/containerd-k8s/bin/crictl

- name: Download checksum-verified independent runc
  ansible.builtin.get_url:
    url: "https://github.com/opencontainers/runc/releases/download/{{ runc_version }}/runc.amd64"
    checksum: "sha256:{{ runc_sha256 }}"
    dest: /opt/containerd-k8s/bin/runc
    mode: '0755'

- name: Generate the independent runtime configuration once
  ansible.builtin.shell: |
    set -eu
    /opt/containerd-k8s/bin/containerd config default > /etc/containerd-k8s/default.toml
    python3 - <<'PY'
    import pathlib,re
    p=pathlib.Path('/etc/containerd-k8s/default.toml')
    s=p.read_text().replace('/var/lib/containerd','/var/lib/containerd-k8s').replace('/run/containerd','/run/containerd-k8s').replace('SystemdCgroup = false','SystemdCgroup = true')
    s=re.sub(r"BinaryName = ['\"]['\"]",'BinaryName = "/opt/containerd-k8s/bin/runc"',s)
    s=re.sub(r'^imports = .*$', 'imports = []', s, flags=re.M)
    if 'SystemdCgroup = true' not in s or '/run/containerd-k8s/containerd.sock' not in s: raise SystemExit('Runtime config shape changed')
    pathlib.Path('/etc/containerd-k8s/config.toml').write_text(s)
    PY
  args:
    creates: /etc/containerd-k8s/config.toml

- name: Configure independent containerd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd-k8s.service
    mode: '0644'
    content: |
      [Unit]
      Description=Independent Kubernetes containerd runtime
      After=network.target
      [Service]
      Environment=PATH=/opt/containerd-k8s/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ExecStart=/opt/containerd-k8s/bin/containerd --config /etc/containerd-k8s/config.toml
      Delegate=yes
      KillMode=process
      Restart=always
      RestartSec=5
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      OOMScoreAdjust=-999
      [Install]
      WantedBy=multi-user.target

- name: Load Kubernetes networking modules
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop: [overlay, br_netfilter, ipip, dm_crypt]

- name: Persist networking modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/branconet-k8s.conf
    content: "overlay\nbr_netfilter\nipip\ndm_crypt\n"
    mode: '0644'

- name: Persist forwarding prerequisites
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-branconet-k8s.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply the controlled forwarding settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-branconet-k8s.conf
  changed_when: false

- name: Persist sufficient inotify instances for coexisting cluster workloads
  ansible.builtin.copy:
    dest: /etc/sysctl.d/98-branconet-inotify.conf
    mode: '0644'
    content: "fs.inotify.max_user_instances = 1024\n"
  tags: [watcher-limits]

- name: Apply the scoped inotify instance limit
  ansible.builtin.command: sysctl -p /etc/sysctl.d/98-branconet-inotify.conf
  changed_when: false
  tags: [watcher-limits]

- name: Enable independent runtime and iSCSI daemon
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [containerd-k8s, iscsid]

- name: Verify the independent CRI endpoint
  ansible.builtin.command:
    argv: [/opt/containerd-k8s/bin/crictl, --runtime-endpoint, "{{ containerd_socket }}", info]
  changed_when: false

- name: Verify Docker remains active
  ansible.builtin.command: systemctl is-active docker
  changed_when: false
