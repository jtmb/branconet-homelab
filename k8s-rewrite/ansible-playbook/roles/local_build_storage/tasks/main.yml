---
- name: Require a finite existing-file growth request
  ansible.builtin.assert:
    that:
      - local_build_storage_grow_existing_gib | int in [0, 128, 144]
      - local_build_storage_grow_existing_gib | int == 0 or local_build_storage_grow_existing_inode | int == 115123265474727363
      - local_build_storage_grow_existing_gib | int == 0 or local_build_storage_resume_empty_inode | int == 0

- name: State the dedicated storage boundary
  ansible.builtin.debug:
    msg: Only the new F drive regular file may be formatted. Verify direct I/O on its exact dedicated loop; no existing data is reformatted and no cluster disk, partition or process is changed.

- name: Create or verify only the exact protected build filesystem
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/python3', '-B', role_path ~ '/files/setup.py', '--apply'] + (['--resume-empty-inode', local_build_storage_resume_empty_inode | string] if local_build_storage_resume_empty_inode | int > 0 else []) + (['--grow-existing-gib', local_build_storage_grow_existing_gib | string, '--grow-existing-inode', local_build_storage_grow_existing_inode | string] if local_build_storage_grow_existing_gib | int > 0 else []) }}"
  register: local_build_storage_result
  when: local_build_storage_apply | bool and not ansible_check_mode
  changed_when: >-
    local_build_storage_result.rc == 0 and (
    (local_build_storage_result.stdout | from_json).created or
    (local_build_storage_result.stdout | from_json).initialized or
    (local_build_storage_result.stdout | from_json).mounted or
    (local_build_storage_result.stdout | from_json).directIOChanged or
    (local_build_storage_result.stdout | from_json).expanded)

- name: Report the verified dedicated storage metadata
  ansible.builtin.debug:
    msg: "{{ local_build_storage_result.stdout | from_json }}"
  when: local_build_storage_apply | bool and not ansible_check_mode

- name: Configure only the labelled controller-side builder network
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -B
      - "{{ role_path }}/files/configure-build-network.py"
      - --apply
  become: false
  register: local_build_storage_network_result
  changed_when: (local_build_storage_network_result.stdout | from_json).created
  when: local_build_storage_apply | bool and local_build_storage_configure_build_network | bool and not ansible_check_mode

- name: Install the root-owned existing-only mount helper for CI startup
  when: local_build_storage_apply | bool and local_build_storage_configure_ci | bool and not ansible_check_mode
  block:
    - name: Create the dedicated root-only helper directory
      ansible.builtin.file:
        path: /usr/local/libexec/branconet-migration
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install the reviewed helper without any credential
      ansible.builtin.copy:
        src: setup.py
        dest: /usr/local/libexec/branconet-migration/mount-build-storage.py
        owner: root
        group: root
        mode: '0700'

    - name: Configure only the existing idle current-user publisher task
      ansible.builtin.assert:
        that:
          - local_build_storage_ci_storage_profile in ['offloaded', 'controller']

    - name: Apply the reviewed publisher storage and lifetime configuration
      ansible.builtin.command:
        argv:
          - /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          - -NoLogo
          - -NoProfile
          - -NonInteractive
          - -EncodedCommand
          - "{{ lookup('ansible.builtin.file', role_path + '/files/configure-local-ci.ps1') | replace('__PUBLISHER_STORAGE_PROFILE__', local_build_storage_ci_storage_profile) | b64encode(encoding='utf-16-le') }}"
      register: local_build_storage_ci_result
      changed_when: (local_build_storage_ci_result.stdout | from_json).changed
