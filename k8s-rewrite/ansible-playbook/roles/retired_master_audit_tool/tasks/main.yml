---
- name: Require the original master and exact task-owned receipts
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'masternode'
      - ansible_host == '192.168.0.4'
      - ansible_user == 'james'
      - ansible_port | int == 2002
      - retired_master_audit_tool_receipt is match('^/home/brajam/.local/share/branconet-migration/local-image-build-offload-20261025/node-cleanup-20261027/master-generated-cleanup/audit-tool-(inventory|retirement)[.]json$')
      - retired_master_audit_tool_primary_proof == '/home/brajam/.local/share/branconet-migration/local-image-build-offload-20261025/node-cleanup-20261027/master-generated-cleanup/audit-tool-primary-proof.json'

- name: Inspect the destination without replacing prior evidence
  ansible.builtin.stat:
    path: "{{ retired_master_audit_tool_receipt }}"
  delegate_to: localhost
  become: false
  register: retired_master_audit_tool_prior

- name: Refuse an existing receipt
  ansible.builtin.assert:
    that: [not retired_master_audit_tool_prior.stat.exists]

- name: Inspect or retire only the pinned original public audit tool
  ansible.builtin.raw: >-
    systemd-run --quiet --wait --pipe --collect
    --unit=branconet-master-audit-tool-{{ 'retire' if retired_master_audit_tool_apply else 'inspect' }}-20261027
    --description='Branconet qualified inactive audit tool'
    --property=MemoryMax=268435456 --property=MemorySwapMax=0
    --property=CPUQuota=100% --property=TasksMax=64 --property=Nice=15
    --property=RuntimeMaxSec=300 --property=ProtectSystem={{ 'full' if retired_master_audit_tool_apply else 'strict' }}
    --property=ProtectHome={{ 'no' if retired_master_audit_tool_apply else 'read-only' }}
    /usr/bin/python3 -B -c {{ lookup('file', role_path + '/files/retire.py', rstrip=false) | quote }}
    --safety-source {{ lookup('file', role_path + '/../retired_master_build_tools/files/retire.py', rstrip=false) | b64encode | quote }}
    --safety-sha256 {{ lookup('file', role_path + '/../retired_master_build_tools/files/retire.py', rstrip=false) | hash('sha256') | quote }}
    --primary-proof {{ lookup('file', retired_master_audit_tool_primary_proof, rstrip=false) | b64encode | quote }}
    {{ '--apply' if retired_master_audit_tool_apply else '' }}
  register: retired_master_audit_tool_result
  failed_when: false
  changed_when: false
  no_log: true

- name: Preserve complete result or refusal
  ansible.builtin.copy:
    dest: "{{ retired_master_audit_tool_receipt }}"
    content: "{{ {'rc': retired_master_audit_tool_result.rc, 'stdout': retired_master_audit_tool_result.stdout, 'stderr': retired_master_audit_tool_result.stderr} | to_nice_json }}"
    force: false
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true

- name: Require complete qualification
  ansible.builtin.assert:
    that: [retired_master_audit_tool_result.rc == 0]
    fail_msg: The exact audit tool operation refused; preserve its receipt and original source.
