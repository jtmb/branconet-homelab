---
- name: Verify source ingress ports have been released before reapplying the final service
  ansible.builtin.command:
    argv: [docker, service, inspect, proxy_traefik]
  register: old_ingress
  changed_when: false
  failed_when: false
  when: migration_network_cutover_complete | bool

- name: Require released Swarm ingress ports
  ansible.builtin.assert:
    that:
      - old_ingress.rc != 0 or ((old_ingress.stdout | from_json)[0].Spec.EndpointSpec.Ports | default([]) | length == 0)
    fail_msg: Source ingress ports remain reserved; restore or complete the recorded port cutover first.
  when: migration_network_cutover_complete | bool

- name: Render temporary Traefik ingress without occupying Swarm host ports
  ansible.builtin.copy:
    dest: /etc/kubernetes/traefik-migration.yaml
    mode: '0644'
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: traefik
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: traefik
        namespace: traefik
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: traefik
      rules:
        - apiGroups: [""]
          resources: [services, endpoints, secrets]
          verbs: [get, list, watch]
        - apiGroups: [discovery.k8s.io]
          resources: [endpointslices]
          verbs: [get, list, watch]
        - apiGroups: [networking.k8s.io]
          resources: [ingresses, ingressclasses]
          verbs: [get, list, watch]
        - apiGroups: [networking.k8s.io]
          resources: [ingresses/status]
          verbs: [update]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: traefik
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: traefik
      subjects:
        - kind: ServiceAccount
          name: traefik
          namespace: traefik
      ---
      apiVersion: networking.k8s.io/v1
      kind: IngressClass
      metadata:
        name: traefik
      spec:
        controller: traefik.io/ingress-controller
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: traefik
        namespace: traefik
      spec:
        replicas: 2
        selector:
          matchLabels: {app: traefik}
        template:
          metadata:
            labels: {app: traefik}
          spec:
            serviceAccountName: traefik
            containers:
              - name: traefik
                image: traefik:{{ traefik_version }}
                args:
                  - --providers.kubernetesingress
                  - --providers.kubernetesingress.ingressclass=traefik
                  - --entrypoints.web.address=:8000
                  - --entrypoints.websecure.address=:8443
                  - --ping=true
                  - --ping.entrypoint=health
                  - --entrypoints.health.address=:9000
                ports:
                  - {name: web, containerPort: 8000}
                  - {name: websecure, containerPort: 8443}
                  - {name: health, containerPort: 9000}
                readinessProbe:
                  httpGet: {path: /ping, port: health}
                livenessProbe:
                  httpGet: {path: /ping, port: health}
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {memory: 512Mi}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: traefik
        namespace: traefik
      spec:
        type: NodePort
        externalIPs: {{ (ingress_external_ips if migration_network_cutover_complete else []) | to_json }}
        selector: {app: traefik}
        ports:
          - {name: web, port: 80, targetPort: web, nodePort: {{ ingress_http_nodeport }}}
          - {name: websecure, port: 443, targetPort: websecure, nodePort: {{ ingress_https_nodeport }}}

- name: Install temporary Kubernetes ingress
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/traefik-migration.yaml
  changed_when: true

- name: Require both ingress replicas Ready
  ansible.builtin.command: kubectl -n traefik rollout status deployment/traefik --timeout=300s
  changed_when: false
