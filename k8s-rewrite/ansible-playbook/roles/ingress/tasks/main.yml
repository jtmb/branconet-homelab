# Ingress Role Tasks
# Installs Traefik ingress controller (master only)

---
# =============================================================================
# TASK 1: Create traefik namespace (master only)
# =============================================================================
- name: Create traefik namespace (master only)
  ansible.builtin.shell: |
    kubectl create namespace traefik --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ns_output
  changed_when: false
  when: inventory_hostname in groups['master']

# =============================================================================
# TASK 2: Apply Traefik CRDs (master only)
# =============================================================================
- name: Apply Traefik CRDs (master only)
  ansible.builtin.shell: |
    kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/{{ traefik_version }}/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: traefik_crds
  changed_when: true
  when: inventory_hostname in groups['master']

# =============================================================================
# TASK 3: Apply Traefik ClusterRole and ClusterRoleBinding (master only)
# =============================================================================
- name: Apply Traefik RBAC (master only)
  ansible.builtin.shell: |
    kubectl apply -f - <<'EOF'
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: traefik-ingress-controller
    rules:
      - apiGroups: [""]
        resources: ["services", "endpoints", "secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions", "networking.k8s.io"]
        resources: ["ingresses", "ingressclasses"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions", "networking.k8s.io"]
        resources: ["ingresses/status"]
        verbs: ["update"]
      - apiGroups: ["traefik.io", "traefik.containo.us"]
        resources: ["middlewares", "middlewaretcps", "ingressroutes", "traefikservices", "ingressroutetcps", "ingressrouteudps", "tlsoptions", "tlsstores", "serverstransports"]
        verbs: ["get", "list", "watch"]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: traefik-ingress-controller
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: traefik-ingress-controller
    subjects:
      - kind: ServiceAccount
        name: traefik-ingress-controller
        namespace: traefik
    EOF
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: traefik_rbac
  changed_when: true
  when: inventory_hostname in groups['master']

# =============================================================================
# TASK 4: Deploy Traefik ServiceAccount, DaemonSet, and Service (master only)
#   - DaemonSet with hostPort ensures every node binds port 80/443 directly
#   - No NodePort needed — just use http://app.branconet.local directly
# =============================================================================
- name: Deploy Traefik controller (master only)
  ansible.builtin.shell: |
    kubectl apply -f - <<'EOF'
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: traefik-ingress-controller
      namespace: traefik
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: traefik
      namespace: traefik
      labels:
        app.kubernetes.io/name: traefik
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traefik
        spec:
          serviceAccountName: traefik-ingress-controller
          containers:
          - name: traefik
            image: traefik:{{ traefik_version }}
            args:
              - --api.insecure=true
              - --api.dashboard=true
              - --providers.kubernetesingress
              - --providers.kubernetescrd
              - --entrypoints.web.address=:80
              - --entrypoints.websecure.address=:443
              - --entrypoints.traefik.address=:8080
              - --log.level=INFO
            ports:
              - name: web
                containerPort: 80
                hostPort: 80
              - name: websecure
                containerPort: 443
                hostPort: 443
              - name: admin
                containerPort: 8080
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: traefik
      namespace: traefik
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: traefik
      ports:
        - name: web
          port: 80
          targetPort: 80
        - name: websecure
          port: 443
          targetPort: 443
        - name: admin
          port: 8080
          targetPort: 8080
    EOF
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: traefik_deploy
  changed_when: true
  when: inventory_hostname in groups['master']

# =============================================================================
# TASK 5: Wait for Traefik to be ready (master only)
# =============================================================================
- name: Wait for Traefik deployment to be ready (master only)
  ansible.builtin.shell: |
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get deployment/traefik -n traefik -o jsonpath='{.status.availableReplicas}' 2>/dev/null
  register: traefik_ready
  changed_when: false
  until: traefik_ready.stdout == "1"
  retries: 15
  delay: 10
  when: inventory_hostname in groups['master']

# =============================================================================
# TASK 6: Verify Traefik pods (master only)
# =============================================================================
- name: Verify Traefik pods are running (master only)
  ansible.builtin.shell: |
    kubectl get pods -n traefik -o wide
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: traefik_pods
  changed_when: false
  when: inventory_hostname in groups['master']