# Verified 2026-10-09: preserve existing hostnames and SSH identities.
[all]
masternode ansible_host=192.168.0.4
workernode2 ansible_host=192.168.0.5
workernode1 ansible_host=192.168.0.6

[master]
masternode

[worker]
workernode2
workernode1

[k8s_nodes:children]
master
worker

[all:vars]
ansible_user=james
ansible_port=2002
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args='-o BatchMode=yes -o StrictHostKeyChecking=yes'
