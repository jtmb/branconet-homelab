# Kubernetes Cluster Configuration Variables
# All configurable variables for the K8s cluster setup

---
# =============================================================================
# KUBERNETES VERSION SETTINGS
# =============================================================================
k8s_version: "v1.30.0"
calico_version: "v3.28.0"
longhorn_version: "v1.6.2"
traefik_version: "v2.11.0"
fleet_version: "latest"

# =============================================================================
# CLUSTER NETWORKING
# =============================================================================
cluster_cidr: "10.244.0.0/16"
pod_network_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"
cluster_domain: "cluster.local"

# =============================================================================
# NODE CONFIGURATION
# =============================================================================
master_node_name: "node1"
worker_node_names:
  - "worker1"
  - "worker2"

# =============================================================================
# STORAGE SETTINGS
# =============================================================================
storage_class: "longhorn"
default_storage_size: "1Gi"

# =============================================================================
# CONTAINER RUNTIME
# =============================================================================
containerd_cgroup_driver: "true"
containerd_log_level: "info"
crictl_version: "v1.30.0"

# =============================================================================
# KUBERNETES COMPONENTS (Enable/Disable)
# =============================================================================
enable_fleet: true
enable_calico: true
enable_longhorn: true
enable_traefik: true
enable_coredns: true

# =============================================================================
# LONGHORN SETTINGS
# =============================================================================
longhorn_default_replica_count: 2
longhorn_default_resource_request_cpu: "500m"
longhorn_default_resource_request_memory: "512Mi"
longhorn_default_resource_limit_cpu: "1000m"
longhorn_default_resource_limit_memory: "1Gi"

# =============================================================================
# TRAEFIK SETTINGS
# =============================================================================
traefik_log_level: "INFO"
traefik_accesslog: true

# =============================================================================
# COREDNS SETTINGS
# =============================================================================
coredns_replicas: 2

# =============================================================================
# CLUSTER NAME (used in kubeadm init)
# =============================================================================
cluster_name: "branconet-k8s"

# =============================================================================
# KUBECONFIG PATH
# =============================================================================
kubeconfig_path: "/root/.kube"

# =============================================================================
# GITOPS SETTINGS (FluxCD)
# =============================================================================
github_user: "jtmb"
github_repo: "branconet-homelab"
github_branch: "main"
gitops_path: "k8s-rewrite/02-applications"
github_token: ""  # Set this to a GitHub personal access token for private repos