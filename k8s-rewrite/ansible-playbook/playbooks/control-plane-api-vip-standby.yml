---
- name: Stage shared API address standby on the current workers
  hosts: worker
  become: true
  serial: 1
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    api_vip: 192.168.0.251
    api_vip_worker_priorities:
      workernode2: 105
      workernode1: 100
    api_vip_standby_configuration: |
      # Managed by control-plane-api-vip-standby.yml
      global_defs {
        enable_script_security
      }
      vrrp_script kubernetes_api_ready {
        script "/usr/bin/curl --silent --fail --max-time 1 --cacert /etc/kubernetes/pki/ca.crt --resolve kubernetes:6443:127.0.0.1 https://kubernetes:6443/readyz"
        user root
        interval 2
        timeout 2
        rise 2
        fall 2
        init_fail
      }
      vrrp_instance kubernetes_api {
        state BACKUP
        interface {{ ansible_default_ipv4.interface }}
        virtual_router_id 151
        priority {{ api_vip_worker_priorities[inventory_hostname] }}
        unicast_src_ip {{ ansible_host }}
        unicast_peer {
      {% for peer in groups['k8s_nodes'] if peer != inventory_hostname %}
          {{ hostvars[peer].ansible_host }}
      {% endfor %}
        }
        virtual_ipaddress {
          {{ api_vip }}/32 dev {{ ansible_default_ipv4.interface }}
        }
        track_script {
          kubernetes_api_ready
        }
      }

  tasks:
    - name: Confirm this is the pre-promotion topology
      ansible.builtin.assert:
        that:
          - api_vip_stage_standby | default(false) | bool
          - groups['master'] == ['masternode']
          - groups['worker'] | sort == api_vip_worker_priorities.keys() | list | sort
          - ansible_default_ipv4.address == ansible_host

    - name: Inspect the root directory required for secure health checks
      ansible.builtin.stat:
        path: /
      register: api_vip_root

    - name: Require the standard root metadata or the verified repair case
      ansible.builtin.assert:
        that:
          - api_vip_root.stat.isdir
          - >-
            (api_vip_root.stat.uid == 0 and api_vip_root.stat.gid == 0 and api_vip_root.stat.mode == '0755')
            or (api_vip_repair_root_metadata | default(false) | bool
            and api_vip_root.stat.uid == 65534 and api_vip_root.stat.gid == 65534 and api_vip_root.stat.mode == '0777'
            and ansible_mounts | selectattr('mount', 'equalto', '/') | selectattr('fstype', 'equalto', 'ext4')
            | selectattr('device', 'equalto', '/dev/mapper/ubuntu--vg-ubuntu--lv') | list | length == 1)

    - name: Restore ownership and permissions on the root directory only
      ansible.builtin.file:
        path: /
        state: directory
        owner: root
        group: root
        mode: "0755"
        recurse: false
      when: api_vip_root.stat.uid != 0

    - name: Confirm no local API server is listening
      ansible.builtin.command: /usr/bin/ss -Hln sport = :6443
      register: api_vip_local_listener
      changed_when: false
      failed_when: api_vip_local_listener.rc != 0 or api_vip_local_listener.stdout | length > 0

    - name: Inspect any existing standby configuration
      ansible.builtin.stat:
        path: /etc/keepalived/keepalived.conf
      register: api_vip_existing

    - name: Preserve any unrelated Keepalived configuration
      ansible.builtin.assert:
        that:
          - not api_vip_existing.stat.exists or (api_vip_existing.stat.isreg and api_vip_existing.stat.checksum == (api_vip_standby_configuration | hash('sha1')))

    - name: Install Keepalived without automatically starting it
      ansible.builtin.apt:
        name: keepalived
        state: present
        policy_rc_d: 101

    - name: Validate and install the readiness-gated standby configuration
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        content: "{{ api_vip_standby_configuration }}"
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/keepalived -t -f %s

    - name: Start the standby and check that the current control plane keeps the address
      block:
        - name: Start Keepalived
          ansible.builtin.systemd_service:
            name: keepalived
            enabled: true
            state: started

        - name: Verify the standby did not claim the address
          ansible.builtin.command: /usr/sbin/ip -o -4 address show
          register: api_vip_standby_addresses
          changed_when: false
          failed_when: api_vip_standby_addresses.rc != 0 or (api_vip ~ '/32') in api_vip_standby_addresses.stdout

        - name: Verify the current control plane still owns the address
          ansible.builtin.command: /usr/sbin/ip -o -4 address show
          delegate_to: masternode
          become: false
          register: api_vip_master_addresses
          changed_when: false
          failed_when: api_vip_master_addresses.rc != 0 or (api_vip ~ '/32') not in api_vip_master_addresses.stdout

        - name: Verify authenticated API readiness over the shared address
          ansible.builtin.command: kubectl --server=https://k8s-api.branconet.lan:6443 get --raw=/readyz
          delegate_to: masternode
          become: false
          changed_when: false

      rescue:
        - name: Withdraw this standby if verification fails
          ansible.builtin.systemd_service:
            name: keepalived
            enabled: false
            state: stopped

        - name: Stop staging after a failed readiness check
          ansible.builtin.fail:
            msg: The worker standby was stopped. Check API address ownership before retrying.
