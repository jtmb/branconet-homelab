# Read-only candidate for Seerr's LAN local-sign-in router.
# Enable only after direct-port and shared enforcement qualification.
[Definition]
failregex = ^\s*stdout F \{"ClientHost":"(?=192\.168\.0\.)<ADDR>","DownstreamStatus":403,"RouterName":"plex-seerr-lan-login-overseerr-branconet-lan-login-i-api-v1-auth-local@kubernetes",
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f\d{0,3})?%%z
ignoreregex = ^\s*stdout F \{"ClientHost":"192\.168\.0\.(?:1|4|5|6|8|25|26|27|25[1-4])",
