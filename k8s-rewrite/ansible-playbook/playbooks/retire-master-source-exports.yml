---
- name: Retire only source exports fully represented by preserved originals and deltas
  hosts: master
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Require exact master and explicit qualified retirement
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'masternode'
          - ansible_host == '192.168.0.4'
          - ansible_user == 'james'
          - ansible_port | int == 2002
          - source_exports_retire | default(false) | bool
    - name: Repeat every source, identity and reference check and retire qualified exports
      retire_master_source_exports:
      no_log: true
