---
# Migration-safe entry point. No reset, disk formatting, share creation or Docker
# runtime replacement. Application imports and cutovers have separate data gates.
- name: Prepare independent Kubernetes runtime alongside Docker
  vars_files: [../group_vars/all.yml]
  hosts: k8s_nodes
  become: true
  any_errors_fatal: true
  roles:
    - {role: bootstrap, tags: [bootstrap]}

- name: Initialize control plane and join existing worker hosts
  vars_files: [../group_vars/all.yml]
  hosts: k8s_nodes
  become: true
  any_errors_fatal: true
  roles:
    - {role: kubernetes, tags: [kubernetes]}

- name: Configure cluster networking and DNS
  vars_files: [../group_vars/all.yml]
  hosts: master
  become: true
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - {role: network, tags: [network]}
    - {role: dns, tags: [dns]}
    - {role: helm, tags: [helm]}
    - {role: longhorn, tags: [longhorn, storage]}
    - {role: samba, tags: [samba, storage]}
    - {role: ingress, tags: [ingress]}
    - {role: gitops, tags: [gitops]}

- name: Verify the expected three Kubernetes nodes
  vars_files: [../group_vars/all.yml]
  hosts: master
  become: true
  any_errors_fatal: true
  tasks:
    # The kubernetes role registers each host as its kubernetes_node_name
    # (node01/node02/node03), not its SSH alias, so the readiness wait must
    # ask for those same names — asking for the SSH aliases waits for nodes
    # that were never registered and reports a successful install as failed.
    - name: Verify every expected node is Ready by its Kubernetes name
      ansible.builtin.command:
        argv: "{{ ['kubectl', '--kubeconfig=/etc/kubernetes/admin.conf', 'wait']
                  + (groups['all'] | map('extract', hostvars, 'kubernetes_node_name')
                                     | map('regex_replace', '^(.*)$', 'node/\\1') | list)
                  + ['--for=condition=Ready', '--timeout=300s'] }}"
      changed_when: false
      tags: [verify]
