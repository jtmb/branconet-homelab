---
# Separate node03 broker staging. Never starts/enables units or replaces publisher files.
- name: Preflight or stage the exact-reader watchdog credential broker
  hosts: workernode2
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'BRANCONET_MIGRATION_SUDO_PASSWORD') }}"
    watchdog_credential_action: preflight
    watchdog_code: /usr/local/libexec/bortus-certificate-watchdog
    watchdog_config: /etc/bortus-certificate-watchdog
    watchdog_credential_sources:
      - certificate_monitor_credentials.py
      - certificate_monitor_runtime.py
      - certificate_monitor_process.py
      - refresh-certificate-monitor-credential.py
      - refresh-certificate-watchdog-credential.py
  tasks:
    - name: Require fixed node03 and bounded operation
      ansible.builtin.assert:
        that:
          - kubernetes_node_name == 'node03'
          - watchdog_credential_action in ['preflight', 'stage']
          - watchdog_public_preflight is defined

    - name: Recheck fixed account bootstrap public inputs and publisher preservation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - |
            import hashlib,json,os,pwd,stat,sys
            from pathlib import Path
            v=json.load(sys.stdin)
            assert os.uname().nodename=='node03'
            a=pwd.getpwnam('bortus-certificate-watchdog')
            assert a.pw_uid==997 and a.pw_gid==997 and a.pw_shell=='/usr/sbin/nologin'
            for name in ['/usr/local/bin/kubectl','/etc/kubernetes/pki/ca.crt']:
                p=Path(name);i=p.lstat()
                assert stat.S_ISREG(i.st_mode) and i.st_uid==0 and not i.st_mode&0o022
                assert hashlib.sha256(p.read_bytes()).hexdigest()==v['rootBootstrapAndPublicToolMetadata'][name]['sha256']
            p=Path('/etc/kubernetes/admin.conf');i=p.lstat()
            assert stat.S_ISREG(i.st_mode) and i.st_uid==0 and stat.S_IMODE(i.st_mode)==0o600
            d=Path('/etc/bortus-certificate-watchdog');i=d.lstat()
            assert stat.S_ISDIR(i.st_mode) and i.st_uid==0 and i.st_gid==997 and stat.S_IMODE(i.st_mode)==0o750
            for row in v['existingPublisherFilesPreserved']:
                i=(d/row['name']).lstat()
                assert stat.S_ISREG(i.st_mode) and i.st_uid==0 and i.st_gid==997
                assert stat.S_IMODE(i.st_mode)==0o640 and i.st_ino==row['inode']
            print('fixed-existing-inputs-match')
        stdin: "{{ watchdog_public_preflight | to_json }}"
      changed_when: false

    - name: Inspect exact new code runtime and credential targets
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ watchdog_code }}"
        - /var/lib/bortus-certificate-watchdog
        - /run/bortus-certificate-watchdog
        - "{{ watchdog_config }}/cluster-ca.crt"
        - "{{ watchdog_config }}/identity.json"
        - "{{ watchdog_config }}/kubeconfig.json"
        - /etc/systemd/system/bortus-certificate-watchdog-credential.service
        - /etc/systemd/system/bortus-certificate-watchdog-credential.timer
      register: watchdog_new_targets

    - name: Refuse replay or unknown existing targets
      ansible.builtin.assert:
        that: watchdog_new_targets.results | selectattr('stat.exists') | list | length == 0

    - name: Read watchdog unit states without mutation
      ansible.builtin.command:
        argv: [systemctl, show, "{{ item }}", "--property=LoadState,ActiveState,UnitFileState"]
      loop:
        - bortus-certificate-watchdog.service
        - bortus-certificate-watchdog-notifications.service
        - bortus-certificate-watchdog-credential.service
        - bortus-certificate-watchdog-credential.timer
      changed_when: false
      register: watchdog_unit_states

    - name: Require absent installed watchdog services
      ansible.builtin.assert:
        that: "'LoadState=not-found' in item.stdout_lines"
      loop: "{{ watchdog_unit_states.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stage only broker after effective live identity qualification
      when: watchdog_credential_action == 'stage'
      block:
        - name: Require exact qualified public enrollment
          ansible.builtin.assert:
            that:
              - watchdog_effective_identity_qualified | default(false) | bool
              - watchdog_credential_enrollment is defined
              - watchdog_credential_enrollment.version == 1
              - watchdog_credential_enrollment.audience == 'https://kubernetes.default.svc.cluster.local'
              - watchdog_credential_enrollment.kubectlSHA256 == watchdog_public_preflight.rootBootstrapAndPublicToolMetadata['/usr/local/bin/kubectl'].sha256
              - watchdog_credential_enrollment.observationsUID == watchdog_public_preflight.observations.uid
              - watchdog_credential_enrollment.policyUID == watchdog_public_preflight.policyUID
              - watchdog_credential_enrollment.leaseUID == watchdog_public_preflight.lease.uid

        - name: Create only root-managed watchdog code directory
          ansible.builtin.file:
            path: "{{ watchdog_code }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install five reviewed credential source files
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../scripts/migration/{{ item }}"
            dest: "{{ watchdog_code }}/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ watchdog_credential_sources }}"

        - name: Copy only existing public cluster CA
          ansible.builtin.copy:
            src: /etc/kubernetes/pki/ca.crt
            dest: "{{ watchdog_config }}/cluster-ca.crt"
            remote_src: true
            owner: root
            group: bortus-certificate-watchdog
            mode: "0640"

        - name: Install public fixed identity tool and resource UID enrollment
          ansible.builtin.copy:
            content: "{{ watchdog_credential_enrollment | to_nice_json }}\n"
            dest: "{{ watchdog_config }}/identity.json"
            owner: root
            group: bortus-certificate-watchdog
            mode: "0640"

        - name: Install public exact-reader configuration with runtime token reference
          ansible.builtin.copy:
            content: >-
              {{ {
                'apiVersion': 'v1', 'kind': 'Config',
                'clusters': [{'name': 'branconet', 'cluster': {
                  'server': 'https://192.168.0.251:6443',
                  'certificate-authority': '/etc/bortus-certificate-watchdog/cluster-ca.crt'}}],
                'users': [{'name': 'bortus-certificate-watchdog', 'user': {
                  'tokenFile': '/run/bortus-certificate-watchdog/token'}}],
                'contexts': [{'name': 'watchdog', 'context': {
                  'cluster': 'branconet', 'user': 'bortus-certificate-watchdog', 'namespace': 'bortus'}}],
                'current-context': 'watchdog'
              } | to_nice_json }}
            dest: "{{ watchdog_config }}/kubeconfig.json"
            owner: root
            group: bortus-certificate-watchdog
            mode: "0640"

        - name: Install only inactive credential service and timer definitions
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - bortus-certificate-watchdog-credential.service
            - bortus-certificate-watchdog-credential.timer

        - name: Verify exact node03 credential unit definitions
          ansible.builtin.command:
            argv: [systemd-analyze, verify, /etc/systemd/system/bortus-certificate-watchdog-credential.service, /etc/systemd/system/bortus-certificate-watchdog-credential.timer]
          changed_when: false

        - name: Reload definitions without minting starting or enabling anything
          ansible.builtin.systemd_service:
            daemon_reload: true
