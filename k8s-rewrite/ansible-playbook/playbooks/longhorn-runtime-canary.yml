---
- name: Deliberate first application runtime cycle through the existing Flux pipeline
  hosts: masternode
  gather_facts: false
  become: false
  tasks:
    - name: Run only the requested fixed canary phase
      when: longhorn_runtime_canary_apply | default(false) | bool and not ansible_check_mode
      block:
        - name: Require the original owner and explicit bounded phase
          ansible.builtin.assert:
            that:
              - ansible_host == '192.168.0.4'
              - longhorn_runtime_canary_phase in ['prepare', 'stop', 'detached', 'resume', 'verify']
        - name: Use the existing Windows Git publisher and read-only native observer
          ansible.builtin.command:
            argv:
              - /home/brajam/.local/share/branconet-migration/venv/bin/python3.12
              - -B
              - "{{ playbook_dir }}/../roles/longhorn_runtime_canary/files/cycle.py"
              - "{{ longhorn_runtime_canary_phase }}"
          delegate_to: localhost
          become: false
          no_log: true
          changed_when: longhorn_runtime_canary_phase in ['stop', 'resume']
          environment:
            PYTHONDONTWRITEBYTECODE: '1'
            TMPDIR: "{{ lookup('env', 'ANSIBLE_LOCAL_TEMP') }}"
            TMP: "{{ lookup('env', 'ANSIBLE_LOCAL_TEMP') }}"
            TEMP: "{{ lookup('env', 'ANSIBLE_LOCAL_TEMP') }}"
