---
# Separate from credential staging; leaves the accepted broker/timer and publisher files alone.
- name: Preflight or install the independent watchdog detector and sender
  hosts: workernode2
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'BRANCONET_MIGRATION_SUDO_PASSWORD') }}"
    watchdog_runtime_action: preflight
    watchdog_runtime_sources:
      - certificate_monitor.py
      - certificate_watchdog.py
      - run-certificate-watchdog.py
      - certificate_monitor_notifications.py
      - deliver-certificate-notifications.py
      - certificate_notification_firewall.py
      - certificate_watchdog_firewall.py
  tasks:
    - name: Require fixed host reviewed operation and broker checkpoint
      ansible.builtin.assert:
        that:
          - kubernetes_node_name == 'node03'
          - watchdog_runtime_action in ['preflight', 'install']
          - watchdog_installed_broker_hashes is defined
          - watchdog_installed_broker_hashes | length == 7

    - name: Read hashes of the seven accepted broker sources and units
      ansible.builtin.stat:
        path: "{{ item.key }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ watchdog_installed_broker_hashes | dict2items }}"
      register: watchdog_runtime_broker_hashes

    - name: Require unchanged root-managed accepted broker bytes
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.uid == 0
          - item.stat.mode == '0644'
          - item.stat.checksum == item.item.value
      loop: "{{ watchdog_runtime_broker_hashes.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Inspect only the new runtime targets
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /usr/local/libexec/bortus-certificate-watchdog/certificate_monitor.py
        - /usr/local/libexec/bortus-certificate-watchdog/certificate_watchdog.py
        - /usr/local/libexec/bortus-certificate-watchdog/run-certificate-watchdog.py
        - /usr/local/libexec/bortus-certificate-watchdog/certificate_monitor_notifications.py
        - /usr/local/libexec/bortus-certificate-watchdog/deliver-certificate-notifications.py
        - /usr/local/libexec/bortus-certificate-watchdog/certificate_notification_firewall.py
        - /usr/local/libexec/bortus-certificate-watchdog/certificate_watchdog_firewall.py
        - /etc/bortus-certificate-watchdog/enrollment.json
        - /var/lib/bortus-certificate-watchdog
        - /run/bortus-certificate-watchdog-cache
        - /etc/systemd/system/bortus-certificate-watchdog.service
        - /etc/systemd/system/bortus-certificate-watchdog-notifications.service
        - /etc/systemd/system/bortus-certificate-watchdog.service.d
        - /etc/systemd/system/bortus-certificate-watchdog-notifications.service.d
      register: watchdog_runtime_targets

    - name: Refuse unknown existing state source or unit replacement
      ansible.builtin.assert:
        that: watchdog_runtime_targets.results | selectattr('stat.exists') | list | length == 0

    - name: Read the existing credential timer without changing it
      ansible.builtin.command:
        argv: [systemctl, show, bortus-certificate-watchdog-credential.timer, "--property=ActiveState,UnitFileState"]
      changed_when: false
      register: watchdog_runtime_timer

    - name: Require accepted enabled credential timer
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in watchdog_runtime_timer.stdout_lines"
          - "'UnitFileState=enabled' in watchdog_runtime_timer.stdout_lines"

    - name: Install runtime only after actual periodic credential acceptance
      when: watchdog_runtime_action == 'install'
      block:
        - name: Require reviewed exact public enrollment and real periodic proof
          ansible.builtin.assert:
            that:
              - watchdog_periodic_credential_qualified | default(false) | bool
              - watchdog_runtime_enrollment is defined
              - watchdog_runtime_enrollment.version == 1
              - watchdog_runtime_enrollment.armed | bool
              - watchdog_runtime_enrollment.observationsUID is match('^[a-f0-9-]{36}$')
              - watchdog_runtime_enrollment.policyUID is match('^[a-f0-9-]{36}$')
              - watchdog_runtime_enrollment.leaseUID is match('^[a-f0-9-]{36}$')

        - name: Install only seven new root-managed runtime source files
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../scripts/migration/{{ item }}"
            dest: "/usr/local/libexec/bortus-certificate-watchdog/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ watchdog_runtime_sources }}"

        - name: Install pinned detector enrollment metadata only
          ansible.builtin.copy:
            content: "{{ watchdog_runtime_enrollment | to_nice_json }}\n"
            dest: /etc/bortus-certificate-watchdog/enrollment.json
            owner: root
            group: bortus-certificate-watchdog
            mode: "0640"

        - name: Install inactive detector and notifier units
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - bortus-certificate-watchdog.service
            - bortus-certificate-watchdog-notifications.service

        - name: Verify exact installed runtime units
          ansible.builtin.command:
            argv: [systemd-analyze, verify, /etc/systemd/system/bortus-certificate-watchdog.service, /etc/systemd/system/bortus-certificate-watchdog-notifications.service]
          changed_when: false

        - name: Reload only without enabling starting or resetting anything
          ansible.builtin.systemd_service:
            daemon_reload: true
