---
- name: Configure Fail2Ban for the host SSH listener
  hosts: k8s_nodes
  serial: 1
  any_errors_fatal: true
  become: true
  vars:
    ssh_jail_override: /etc/fail2ban/jail.d/99-branconet-ssh.local
  tasks:
    - name: Install Fail2Ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Record existing SSH override
      ansible.builtin.stat:
        path: "{{ ssh_jail_override }}"
      register: previous_ssh_jail

    - name: Apply and validate the SSH jail
      block:
        - name: Set the jail port to the SSH inventory port
          ansible.builtin.copy:
            dest: "{{ ssh_jail_override }}"
            owner: root
            group: root
            mode: "0644"
            backup: true
            content: |
              [sshd]
              enabled = true
              port = {{ ansible_port | default(22) | int }}
          register: ssh_jail

        - name: Validate Fail2Ban configuration before activation
          ansible.builtin.command: fail2ban-client -t
          changed_when: false

        - name: Enable and start Fail2Ban
          ansible.builtin.service:
            name: fail2ban
            enabled: true
            state: started

        - name: Reload only the changed SSH jail
          ansible.builtin.command: fail2ban-client reload --restart sshd
          when: ssh_jail.changed

        - name: Verify the SSH jail is running
          ansible.builtin.command: fail2ban-client status sshd
          changed_when: false

      rescue:
        - name: Restore the previous override
          ansible.builtin.copy:
            src: "{{ ssh_jail.backup_file }}"
            dest: "{{ ssh_jail_override }}"
            remote_src: true
            mode: preserve
          when: ssh_jail.backup_file is defined

        - name: Remove the new override on failed activation
          ansible.builtin.file:
            path: "{{ ssh_jail_override }}"
            state: absent
          when:
            - not previous_ssh_jail.stat.exists
            - ssh_jail.changed | default(false)

        - name: Reload the restored configuration
          ansible.builtin.command: fail2ban-client reload --restart sshd
          when: ssh_jail.changed | default(false)

        - name: Stop the rollout after a failed node
          ansible.builtin.fail:
            msg: SSH jail rollout failed. Inspect this node before proceeding.
