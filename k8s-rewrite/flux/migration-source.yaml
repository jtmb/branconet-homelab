apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: migration-validated
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/jtmb/branconet-homelab.git
  ref:
    branch: codex/kubernetes-validated
  ignore: '/.git

    '
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration-releases
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s-rewrite/flux/migration-releases
  prune: false
  sourceRef:
    kind: GitRepository
    name: migration-validated
  wait: true
  timeout: 8m
