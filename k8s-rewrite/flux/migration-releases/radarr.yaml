apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  interval: 5m
  releaseName: radarr
  targetNamespace: plex
  storageNamespace: plex
  timeout: 8m
  chart:
    spec:
      chart: ./k8s-rewrite/charts/media-stack/radarr
      sourceRef:
        kind: GitRepository
        name: migration-validated
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    enabled: true
    replicaCount: 1
    migration:
      staging: true
  suspend: false
