apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-website
  namespace: flux-system
spec:
  interval: 5m
  releaseName: minecraft-website
  targetNamespace: web-apps
  storageNamespace: web-apps
  timeout: 8m
  chart:
    spec:
      chart: ./k8s-rewrite/charts/apps/minecraft-website
      sourceRef:
        kind: GitRepository
        name: migration-validated
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    enabled: true
    replicaCount: 1
    migration:
      verified: true
      staging: false
      routingReviewed: true
  suspend: false
