# Plex Media Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
        branconet.io/type: system
        homepage.group: Media
        homepage.name: Plex
        homepage.icon: "https://plex.tv/sites/static/img/logo.png"
        homepage.href: "http://plex.branconet.local/"
        homepage.description: Plex Media Server
    spec:
      containers:
      - name: plex
        image: lscr.io/linuxserver/plex:latest
        ports:
        - containerPort: 32400
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Toronto"
        - name: VERSION
          value: "latest"
        # - name: PLEX_CLAIM
        #   valueFrom:
        #     secretKeyRef:
        #       name: plex-claim-token
        #       key: claim-token
        # - name: ADVERTISE_IP
        #   value: "http://${master_node}:32400/"
        # - name: NVIDIA_VISIBLE_DEVICES
        #   value: "all"
        # - name: NVIDIA_DRIVER_CAPABILITIES
        #   value: "compute,video,utility"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tv
          mountPath: /tv
        - name: movies
          mountPath: /movies
        - name: pvr
          mountPath: /pvr
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: tv
          persistentVolumeClaim:
            claimName: plex-tv-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: plex-movies-pvc
        - name: pvr
          persistentVolumeClaim:
            claimName: plex-pvr-pvc
      # GPU device request for hardware transcoding
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
