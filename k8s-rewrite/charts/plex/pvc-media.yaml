# Plex Media Samba PVs + PVCs (CSI SMB driver)
# 3 separate PVs for tv, movies, pvr — each mounts a subdirectory directly
# This avoids the CSI SMB subPath bug (separate mounts = no subPath needed)
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-tv-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - noserverino
    - cache=none
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: plex-tv
    volumeAttributes:
      source: "//192.168.0.8/plex_smb_share/tv"
      options: "uid=1000,gid=1000,forceuid,forcegid,file_mode=0755,noserverino,cache=none"
    nodeStageSecretRef:
      name: smb-creds
      namespace: plex
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-movies-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - noserverino
    - cache=none
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: plex-movies
    volumeAttributes:
      source: "//192.168.0.8/plex_smb_share/movies"
      options: "uid=1000,gid=1000,forceuid,forcegid,file_mode=0755,noserverino,cache=none"
    nodeStageSecretRef:
      name: smb-creds
      namespace: plex
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-pvr-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - noserverino
    - cache=none
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: plex-pvr
    volumeAttributes:
      source: "//192.168.0.8/plex_smb_share/pvr"
      options: "uid=1000,gid=1000,forceuid,forcegid,file_mode=0755,noserverino,cache=none"
    nodeStageSecretRef:
      name: smb-creds
      namespace: plex
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-tv-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: plex-tv-pv
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-movies-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: plex-movies-pv
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-pvr-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: plex-pvr-pv
  storageClassName: ""
