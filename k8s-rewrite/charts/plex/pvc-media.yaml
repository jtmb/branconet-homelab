# Plex Media Samba PV + PVC (CSI SMB driver)
# Mounts TrueNAS plex_smb_share directly via smb.csi.k8s.io
# Subdirectories (tv/, movies/, pvr/) accessed via subPath in deployment
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-samba-pv-v2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: plex-samba-share-v2
    volumeAttributes:
      source: "//192.168.0.8/plex_smb_share"
      options: "uid=1000,gid=1000,forceuid,forcegid,file_mode=0755,noserverino,cache=none"
    nodeStageSecretRef:
      name: smb-creds
      namespace: plex
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-samba-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: plex-samba-pv-v2
  storageClassName: ""
