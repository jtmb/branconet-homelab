# nginx-hello Deployment — minimal nginx with a custom "Hello from Branconet" page
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: nginx-hello
  labels:
    app: nginx-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
        branconet.io/type: app
      annotations:
        homepage.group: Test
        homepage.name: nginx-hello
        homepage.icon: "https://nginx.org/favicon.ico"
        homepage.href: "http://nginx-hello.branconet.local/"
        homepage.description: "Minimal nginx serving a static hello-world page from Longhorn"
    spec:
      containers:
      - name: nginx-hello
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      initContainers:
      - name: init-html
        image: busybox:musl
        command:
        - sh
        - -c
        - |
          cat > /html/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Hello from Branconet</title>
            <style>
              body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
              .card { text-align: center; padding: 3rem; border: 1px solid #334155; border-radius: 1rem; background: #1e293b; }
              h1 { font-size: 2.5rem; margin: 0 0 0.5rem; color: #38bdf8; }
              p { color: #94a3b8; margin: 0.25rem 0; }
              .pod { font-family: monospace; font-size: 0.85rem; color: #64748b; margin-top: 1.5rem; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🚀 Hello from Branconet!</h1>
              <p>nginx-hello is running on Kubernetes + Longhorn</p>
              <div class="pod">Pod: <span id="pod">???</span></div>
            </div>
            <script>
              fetch(window.location.href, { method: 'HEAD' })
                .then(r => { document.getElementById('pod').textContent = r.headers.get('x-pod-name') || 'unknown'; })
                .catch(() => {});
            </script>
          </body>
          </html>
          EOF
        volumeMounts:
        - name: data
          mountPath: /html
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nginx-hello-data-pvc
