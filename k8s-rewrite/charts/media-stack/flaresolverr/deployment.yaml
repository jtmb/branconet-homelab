# FlareSolverr — Cloudflare challenge solver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: plex
  labels:
    app: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
        branconet.io/type: app
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
        - containerPort: 8191
          name: http
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: TZ
          value: "America/New_York"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
