resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: plex
    namespace: plex
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: plex
    template:
      metadata:
        labels:
          app: plex
        annotations:
          homepage.group: Media
          homepage.name: Plex
          homepage.icon: https://plex.tv/sites/static/img/logo.png
          homepage.href: http://plex.branconet.local/
          homepage.description: Plex Media Server
      spec:
        containers:
        - name: plex
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p1900-udp
            containerPort: 1900
            protocol: UDP
          - name: p5353-udp
            containerPort: 5353
            protocol: UDP
          - name: p8324-tcp
            containerPort: 8324
            protocol: TCP
          - name: p32400-tcp
            containerPort: 32400
            protocol: TCP
          - name: p32410-udp
            containerPort: 32410
            protocol: UDP
          - name: p32412-udp
            containerPort: 32412
            protocol: UDP
          - name: p32413-udp
            containerPort: 32413
            protocol: UDP
          - name: p32414-udp
            containerPort: 32414
            protocol: UDP
          - name: p32469-tcp
            containerPort: 32469
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /config
            readOnly: false
          - name: data-1
            mountPath: /movies
            readOnly: false
          - name: data-2
            mountPath: /pvr
            readOnly: false
          - name: data-3
            mountPath: /tv
            readOnly: false
          env:
          - name: MIGRATION_COMMAND_0
            valueFrom:
              secretKeyRef:
                name: plex-launch
                key: command-0
          command:
          - $(MIGRATION_COMMAND_0)
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          imagePullPolicy: IfNotPresent
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: plex-data-0
        - name: data-1
          persistentVolumeClaim:
            claimName: plex-data-1
        - name: data-2
          persistentVolumeClaim:
            claimName: plex-data-2
        - name: data-3
          persistentVolumeClaim:
            claimName: plex-data-3
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: plex-data-0
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 13Gi
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: plex-plex-data-1
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    - uid=1000
    - gid=1000
    - file_mode=0755
    - dir_mode=0755
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: plex-plex-data-1
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/movies
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
