enabled: false
replicaCount: 0
image: ''
environmentSecret: qbit-monitor-runtime
migration:
  verified: false
  state: manifest-review-pending
  sources:
  - repository/media-stack/qbit-monitor
  requiredEnvironmentKeys: []
  storageSizingVerified: false
  nativeSecretsImported: false
  applicationChecksPassed: false
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: qbit-monitor
    namespace: plex
    labels:
      app: qbit-monitor
  spec:
    replicas: 0
    selector:
      matchLabels:
        app: qbit-monitor
    template:
      metadata:
        labels:
          app: qbit-monitor
          branconet.io/type: app
      spec:
        containers:
        - name: qbit-monitor
          image: jtmb92/qbit-monitor:latest
          env:
          - name: QBITTORRENT_STATUS_NOTIFICATION
            value: 'on'
          - name: QBITTORRENT_HOST
            value: http://qbittorrent-webui.plex.svc.cluster.local:8112
          - name: QBITTORRENT_USERNAME
            valueFrom:
              secretKeyRef:
                name: qbitmonitor-creds-secret
                key: username
                optional: true
          - name: QBITTORRENT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: qbitmonitor-creds-secret
                key: password
                optional: true
          - name: PORT_FORWARDING
            value: 'on'
          - name: CHECK_INTERVAL_FORWARDED_PORT
            value: 1h
          - name: PORT_FORWARD_FILE
            value: /tmp/gluetun/forwarded_port
          - name: PORT_UPDATED_NOTIFICATION
            value: 'on'
          - name: CHECK_INTERVAL_TORRENT_MONITORING
            value: 10s
          - name: NEW_DOWNLOAD_NOTIFICATION
            value: 'on'
          - name: METADATA_STUCK_NOTIFICATION
            value: 'on'
          - name: DOWNLOAD_COMPLETE_NOTIFICATION
            value: 'off'
          - name: DISCORD_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: qbitmonitor-creds-secret
                key: discord-webhook-url
                optional: true
          - name: PUID
            value: '1000'
          - name: PGID
            value: '1000'
          - name: TZ
            value: America/New_York
          volumeMounts:
          - name: gluetun-port
            mountPath: /tmp/gluetun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        volumes:
        - name: gluetun-port
          persistentVolumeClaim:
            claimName: qbit-monitor-samba-pvc
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: qbit-monitor-ingress
    namespace: plex
  spec:
    rules:
    - host: qbit-monitor.branconet.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: qbit-monitor
              port:
                number: 80
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: qbit-monitor-samba-pv
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: qbit-monitor-samba
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/shared-container-folder/gluetun
        options: uid=0,gid=0,forceuid,forcegid,file_mode=0755,noserverino,cache=none
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: qbit-monitor-samba-pvc
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: 1Gi
    volumeName: qbit-monitor-samba-pv
    storageClassName: ''
- apiVersion: v1
  kind: Service
  metadata:
    name: qbit-monitor
    namespace: plex
  spec:
    type: ClusterIP
    ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
    selector:
      app: qbit-monitor
