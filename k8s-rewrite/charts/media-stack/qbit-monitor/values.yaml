enabled: false
replicaCount: 0
image: jtmb92/qbit-monitor@sha256:b1ba462564843f9f328b287a34e8a7dc4cd1f218e085862a77f42aaa1703ffec
environmentSecret: qbit-monitor-runtime
migration:
  verified: false
  state: private-accepted-production-reconciled
  sources:
  - repository/media-stack/qbit-monitor
  requiredEnvironmentKeys: []
  storageSizingVerified: true
  nativeSecretsImported: true
  applicationChecksPassed: true
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: qbit-monitor
    namespace: plex
    labels:
      app: qbit-monitor
  spec:
    replicas: 0
    selector:
      matchLabels:
        app: qbit-monitor
    template:
      metadata:
        labels:
          app: qbit-monitor
          branconet.io/type: app
      spec:
        securityContext:
          fsGroup: 1000
        containers:
        - name: qbit-monitor
          image: '{{ .Values.image }}'
          env:
          - name: QBITTORRENT_STATUS_NOTIFICATION
            value: 'on'
          - name: QBITTORRENT_HOST
            value: http://qbittorrent-webui.plex.svc.cluster.local:8112
          - name: QBITTORRENT_USERNAME
            valueFrom:
              secretKeyRef:
                name: qbittorrent-runtime
                key: QBITTORRENT_USERNAME
                optional: false
          - name: QBITTORRENT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: qbittorrent-runtime
                key: QBITTORRENT_PASSWORD
                optional: false
          - name: PORT_FORWARDING
            value: 'on'
          - name: CHECK_INTERVAL_FORWARDED_PORT
            value: 1h
          - name: PORT_FORWARD_FILE
            value: /tmp/gluetun/forwarded_port
          - name: PORT_UPDATED_NOTIFICATION
            value: 'on'
          - name: CHECK_INTERVAL_TORRENT_MONITORING
            value: 10s
          - name: NEW_DOWNLOAD_NOTIFICATION
            value: 'on'
          - name: METADATA_STUCK_NOTIFICATION
            value: 'on'
          - name: DOWNLOAD_COMPLETE_NOTIFICATION
            value: 'off'
          - name: DISCORD_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: qbitmonitor-creds-secret
                key: discord-webhook-url
                optional: false
          - name: PUID
            value: '1000'
          - name: PGID
            value: '1000'
          - name: TZ
            value: America/New_York
          volumeMounts:
          - name: gluetun-port
            mountPath: /tmp/gluetun
            readOnly: true
          - name: monitor-state
            mountPath: /app/state
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          imagePullPolicy: IfNotPresent
        volumes:
        - name: gluetun-port
          persistentVolumeClaim:
            claimName: gluetun-data-1-retry1
        - name: monitor-state
          persistentVolumeClaim:
            claimName: qbit-monitor-state
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qbittorrent
              topologyKey: kubernetes.io/hostname
              namespaces:
              - plex
    strategy:
      type: Recreate
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: qbit-monitor-state
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: qbit-monitor
    namespace: plex
  spec:
    type: ClusterIP
    ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
    selector:
      app: qbit-monitor
