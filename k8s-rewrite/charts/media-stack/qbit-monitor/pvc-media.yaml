# qBit-Monitor Samba PV + PVC — shares Gluetun port-forwarding state with qbittorrent-vpn
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbit-monitor-samba-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - noserverino
    - cache=none
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: qbit-monitor-samba
    volumeAttributes:
      source: "//192.168.0.8/plex_smb_share/shared-container-folder/gluetun"
      options: "uid=0,gid=0,forceuid,forcegid,file_mode=0755,noserverino,cache=none"
    nodeStageSecretRef:
      name: smb-creds
      namespace: plex
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-monitor-samba-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: qbit-monitor-samba-pv
  storageClassName: ""
