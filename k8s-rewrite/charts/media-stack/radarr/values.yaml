enabled: false
replicaCount: 0
image: linuxserver/radarr:latest@sha256:ca43905eaf2dd11425efdcfe184892e43806b1ae0a830440c825cecbc2629cfb
environmentSecret: radarr-runtime
migration:
  verified: false
  state: private-accepted-production-reconciled
  sources:
  - media_radarr
  requiredEnvironmentKeys:
  - COMPlus_EnableDiagnostics
  - HOME
  - LSIO_FIRST_PARTY
  - PATH
  - PGID
  - PS1
  - PUID
  - S6_CMD_WAIT_FOR_SERVICES_MAXTIME
  - S6_STAGE2_HOOK
  - S6_VERBOSITY
  - TERM
  - TMPDIR
  - TZ
  - VIRTUAL_ENV
  - XDG_CONFIG_HOME
  storageSizingVerified: true
  nativeSecretsImported: true
  applicationChecksPassed: true
  dataCopies:
  - sourceHost: 192.168.0.4
    sourcePath: /mnt/nfs-container-volumes/radarr
    destinationPVC: radarr-data-0
    mountPath: /config
    measuredBytes: 503599882
    allocatedGiB: 2
    uid: 1000
    gid: 1000
  sourceCommandArgumentsRequireReview: false
  launchSecretKeys: []
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: radarr
    namespace: plex
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: radarr
    template:
      metadata:
        labels:
          app: radarr
        annotations:
          homepage.group: Media
          homepage.name: Radarr
          homepage.icon: https://i0.wp.com/devildogtech.com/wp-content/uploads/2022/10/radarr.png?resize=280%2C280&ssl=1
          homepage.href: http://radarr.branconet.local/
          homepage.description: Radarr movie fetching and monitoring
      spec:
        containers:
        - name: radarr
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p7878-tcp
            containerPort: 7878
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /config
            readOnly: false
          - name: data-1
            mountPath: /media/movies
            readOnly: false
          - name: data-2
            mountPath: /downloads
            readOnly: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          env: []
          imagePullPolicy: IfNotPresent
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: radarr-data-0
        - name: data-1
          persistentVolumeClaim:
            claimName: radarr-data-1
        - name: data-2
          persistentVolumeClaim:
            claimName: radarr-data-2
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: radarr-data-0
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: plex-radarr-data-1
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    - uid=1000
    - gid=1000
    - file_mode=0755
    - dir_mode=0755
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: plex-radarr-data-1
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/movies
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: radarr-data-1
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: ''
    volumeName: plex-radarr-data-1
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: plex-radarr-data-2
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    - uid=1000
    - gid=1000
    - file_mode=0755
    - dir_mode=0755
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: plex-radarr-data-2
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/downloads
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: radarr-data-2
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: ''
    volumeName: plex-radarr-data-2
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: radarr
    namespace: plex
  spec:
    selector:
      app: radarr
    ports:
    - name: p7878-tcp
      port: 7878
      targetPort: 7878
      protocol: TCP
    type: ClusterIP
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: radarr-http
    namespace: plex
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
  spec:
    ingressClassName: traefik
    rules:
    - host: radarr.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: radarr
              port:
                number: 7878
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: radarr-https
    namespace: plex
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
  spec:
    ingressClassName: traefik
    rules:
    - host: radarr.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: radarr
              port:
                number: 7878
- apiVersion: v1
  kind: Service
  metadata:
    name: radarr-published
    namespace: plex
    labels:
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: radarr
      meta.helm.sh/release-namespace: plex
  spec:
    type: ClusterIP
    externalIPs:
    - 192.168.0.4
    - 192.168.0.5
    - 192.168.0.6
    selector:
      app: radarr
    ports:
    - name: p7878-tcp
      port: 7878
      targetPort: 7878
      protocol: TCP
