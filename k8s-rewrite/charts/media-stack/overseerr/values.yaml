enabled: false
replicaCount: 0
image: lscr.io/linuxserver/overseerr:latest@sha256:53a1b839ffa81f139e1552840772bff8a5d13f5c78a69cce22458b9a6cd0844d
environmentSecret: overseerr-runtime
migration:
  verified: false
  state: live-integration-review-pending
  sources:
  - media_overseerr
  requiredEnvironmentKeys:
  - HOME
  - LOG_LEVEL
  - LSIO_FIRST_PARTY
  - PATH
  - PS1
  - S6_CMD_WAIT_FOR_SERVICES_MAXTIME
  - S6_STAGE2_HOOK
  - S6_VERBOSITY
  - TERM
  - TMPDIR
  - TZ
  - VIRTUAL_ENV
  storageSizingVerified: true
  nativeSecretsImported: true
  applicationChecksPassed: false
  dataCopies:
  - sourceHost: 192.168.0.5
    sourcePath: /mnt/container-program-files/overseerr/config
    destinationPVC: overseerr-data-0
    mountPath: /config
    measuredBytes: 7596110
    allocatedGiB: 1
    uid: 911
    gid: 911
  sourceCommandArgumentsRequireReview: false
  launchSecretKeys: []
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: overseerr
    namespace: plex
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: overseerr
    template:
      metadata:
        labels:
          app: overseerr
        annotations:
          homepage.group: Media
          homepage.name: Overseerr
          homepage.icon: https://static-00.iconduck.com/assets.00/overseerr-icon-2048x2048-5ncr26li.png
          homepage.href: http://overseerr.branconet.local/
          homepage.description: Media request and discovery
      spec:
        containers:
        - name: overseerr
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p5055-tcp
            containerPort: 5055
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /config
            readOnly: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          env: []
          imagePullPolicy: IfNotPresent
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: overseerr-data-0
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: overseerr-data-0
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: overseerr
    namespace: plex
  spec:
    selector:
      app: overseerr
    ports:
    - name: p5055-tcp
      port: 5055
      targetPort: 5055
      protocol: TCP
    type: ClusterIP
