enabled: false
replicaCount: 0
image: linuxserver/sonarr:latest@sha256:76414c033f290d3c9f1f9dfad71150abe71d92592369a3377a5903d579e6e2b2
environmentSecret: sonarr-runtime
migration:
  verified: false
  state: live-integration-review-pending
  sources:
  - media_sonarr
  requiredEnvironmentKeys:
  - COMPlus_EnableDiagnostics
  - HOME
  - LSIO_FIRST_PARTY
  - PATH
  - PGID
  - PS1
  - PUID
  - S6_CMD_WAIT_FOR_SERVICES_MAXTIME
  - S6_STAGE2_HOOK
  - S6_VERBOSITY
  - SONARR_BRANCH
  - SONARR_CHANNEL
  - TERM
  - TMPDIR
  - TZ
  - VIRTUAL_ENV
  - XDG_CONFIG_HOME
  storageSizingVerified: true
  nativeSecretsImported: true
  applicationChecksPassed: false
  dataCopies:
  - sourceHost: 192.168.0.6
    sourcePath: /mnt/nfs-container-volumes/sonarr/config
    destinationPVC: sonarr-data-0
    mountPath: /config
    measuredBytes: 464258217
    allocatedGiB: 2
    uid: 1000
    gid: 1000
  sourceCommandArgumentsRequireReview: false
  launchSecretKeys: []
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: sonarr
    namespace: plex
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: sonarr
    template:
      metadata:
        labels:
          app: sonarr
        annotations:
          homepage.group: Media
          homepage.name: Sonarr
          homepage.icon: https://res.cloudinary.com/razordarkamg/image/upload/v1621212884/SonarrV3_pufacd.png
          homepage.href: http://sonarr.branconet.local/
          homepage.description: Sonarr TV series fetching and monitoring
      spec:
        containers:
        - name: sonarr
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p8989-tcp
            containerPort: 8989
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /config
            readOnly: false
          - name: data-1
            mountPath: /media/tv
            readOnly: false
          - name: data-2
            mountPath: /downloads
            readOnly: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          env: []
          imagePullPolicy: IfNotPresent
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: sonarr-data-0
        - name: data-1
          persistentVolumeClaim:
            claimName: sonarr-data-1
        - name: data-2
          persistentVolumeClaim:
            claimName: sonarr-data-2
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: sonarr-data-0
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: plex-sonarr-data-1
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    - uid=1000
    - gid=1000
    - file_mode=0755
    - dir_mode=0755
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: plex-sonarr-data-1
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/tv
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: sonarr-data-1
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: ''
    volumeName: plex-sonarr-data-1
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: plex-sonarr-data-2
    annotations:
      helm.sh/resource-policy: keep
  spec:
    capacity:
      storage: 1Gi
    accessModes:
    - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    mountOptions:
    - noserverino
    - cache=none
    - uid=1000
    - gid=1000
    - file_mode=0755
    - dir_mode=0755
    csi:
      driver: smb.csi.k8s.io
      volumeHandle: plex-sonarr-data-2
      volumeAttributes:
        source: //192.168.0.8/plex_smb_share/downloads
      nodeStageSecretRef:
        name: smb-creds
        namespace: plex
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: sonarr-data-2
    namespace: plex
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: ''
    volumeName: plex-sonarr-data-2
    accessModes:
    - ReadWriteMany
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: sonarr
    namespace: plex
  spec:
    selector:
      app: sonarr
    ports:
    - name: p8989-tcp
      port: 8989
      targetPort: 8989
      protocol: TCP
    type: ClusterIP
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: sonarr-http
    namespace: plex
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
  spec:
    ingressClassName: traefik
    rules:
    - host: sonarr.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: sonarr
              port:
                number: 8989
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: sonarr-https
    namespace: plex
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
  spec:
    ingressClassName: traefik
    rules:
    - host: sonarr.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: sonarr
              port:
                number: 8989
