enabled: false
replicaCount: 0
image: ''
environmentSecret: http-echo-runtime
migration:
  verified: false
  state: manifest-review-pending
  sources:
  - repository/test-stack/http-echo
  requiredEnvironmentKeys: []
  storageSizingVerified: false
  nativeSecretsImported: false
  applicationChecksPassed: false
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: http-echo
    namespace: http-echo
    labels:
      app: http-echo
  spec:
    replicas: 0
    selector:
      matchLabels:
        app: http-echo
    template:
      metadata:
        labels:
          app: http-echo
          branconet.io/type: app
        annotations:
          homepage.group: Test
          homepage.name: http-echo
          homepage.icon: https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/hashicorp.svg
          homepage.href: http://echo.branconet.local/
          homepage.description: "Echo server \u2014 returns whatever you POST for\
            \ curl/connectivity testing"
      spec:
        containers:
        - name: http-echo
          image: hashicorp/http-echo:latest
          args:
          - -text="Hello from Branconet http-echo on Kubernetes + Longhorn!"
          - -listen=:8080
          ports:
          - containerPort: 8080
            name: http
          volumeMounts:
          - name: data
            mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: http-echo-data-pvc
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: http-echo-ingress
    namespace: http-echo
  spec:
    rules:
    - host: http-echo.branconet.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: http-echo
              port:
                number: 80
- apiVersion: traefik.containo.us/v1alpha1
  kind: IngressRoute
  metadata:
    name: http-echo-ingress
    namespace: http-echo
  spec:
    entryPoints:
    - web
    routes:
    - match: Host(`echo.branconet.local`)
      kind: Rule
      services:
      - name: http-echo
        port: 80
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: http-echo-data-pvc
    namespace: http-echo
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    storageClassName: longhorn
- apiVersion: v1
  kind: Service
  metadata:
    name: http-echo
    namespace: http-echo
  spec:
    type: ClusterIP
    ports:
    - port: 80
      targetPort: 8080
      name: http
    selector:
      app: http-echo
