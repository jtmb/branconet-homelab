enabled: false
replicaCount: 0
image: traefik/whoami:latest@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
environmentSecret: whoami-runtime
migration:
  verified: false
  state: live-integration-review-pending
  sources:
  - proxy_whoami
  requiredEnvironmentKeys:
  - PATH
  storageSizingVerified: true
  nativeSecretsImported: false
  applicationChecksPassed: false
  dataCopies: []
  sourceCommandArgumentsRequireReview: true
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: whoami
    namespace: whoami
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: whoami
    template:
      metadata:
        labels:
          app: whoami
        annotations:
          homepage.group: Test
          homepage.name: whoami
          homepage.icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.icon.png
          homepage.href: http://whoami.branconet.local/
          homepage.description: "Lightweight HTTP request echo \u2014 shows hostname,\
            \ IP, and headers"
      spec:
        containers:
        - name: whoami
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p80-tcp
            containerPort: 80
            protocol: TCP
- apiVersion: v1
  kind: Service
  metadata:
    name: whoami
    namespace: whoami
  spec:
    selector:
      app: whoami
    ports:
    - name: p80-tcp
      port: 80
      targetPort: 80
      protocol: TCP
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: whoami
    namespace: whoami
  spec:
    ingressClassName: traefik
    rules:
    - host: whoami.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: whoami
              port:
                number: 80
