{{- if .Values.enabled }}
{{- if and (not .Values.migration.verified) (not .Values.migration.staging) }}
{{- fail "Migration preflight is required for private staging; full acceptance is required for routing" }}
{{- end }}
{{- range .Values.resources }}
{{- if not (and $.Values.migration.staging (not $.Values.migration.routingReviewed) (or (eq .kind "Ingress") (eq .kind "IngressRoute"))) }}
{{- if and $.Values.migration.staging (eq .kind "Service") (hasKey .spec "type") (ne .spec.type "ClusterIP") }}
{{- fail "Unaccepted staging must use ClusterIP Services" }}
{{- end }}
{{- if or (eq .kind "Deployment") (eq .kind "StatefulSet") }}
{{- if and $.Values.migration.staging (gt (int $.Values.replicaCount) 0) .spec.template.spec.hostNetwork (not $.Values.migration.hostPortsReviewed) }}
{{- fail "Host networking requires source-port exclusivity and a separate cutover review" }}
{{- end }}
{{- $_ := set .spec "replicas" (int $.Values.replicaCount) }}
{{- end }}
---
{{ tpl (toYaml .) $ }}
{{- end }}
{{- end }}
{{- end }}
