              cpu: 25m
              memory: 64Mi
          env: []
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: minecraft-exporter-data-0
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: minecraft-exporter-data-0
