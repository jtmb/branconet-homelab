resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: wordpress-db
    namespace: wordpress
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: wordpress-db
    template:
      metadata:
        labels:
          app: wordpress-db
        annotations: {}
      spec:
        containers:
        - name: wordpress-db
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
