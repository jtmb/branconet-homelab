- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: wordpress-db-data-0
    namespace: wordpress
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: wordpress-db
    namespace: wordpress
  spec:
    selector:
      app: wordpress-db
    ports:
    - name: p3306-tcp
      port: 3306
      targetPort: 3306
      protocol: TCP
    - name: p33060-tcp
      port: 33060
      targetPort: 33060
      protocol: TCP
    type: ClusterIP
