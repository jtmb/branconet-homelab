enabled: false
replicaCount: 0
image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
environmentSecret: wordpress-db-runtime
migration:
  verified: false
