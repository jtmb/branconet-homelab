enabled: false
replicaCount: 0
image: vaultwarden/server:latest@sha256:43498a94b22f9563f2a94b53760ab3e710eefc0d0cac2efda4b12b9eb8690664
environmentSecret: vaultwarden-runtime
migration:
  verified: false
  state: live-integration-review-pending
  sources:
  - vault_vaultwarden
  requiredEnvironmentKeys:
  - DEBIAN_FRONTEND
  - PATH
  - PGID
  - PUID
  - ROCKET_ADDRESS
  - ROCKET_PORT
  - ROCKET_PROFILE
  - SIGNUPS_ALLOWED
  storageSizingVerified: true
  nativeSecretsImported: true
  applicationChecksPassed: false
  dataCopies:
  - sourceHost: 192.168.0.5
    sourcePath: /mnt/container-program-files/vault_warden/swarm
    destinationPVC: vaultwarden-data-0
    mountPath: /data
    measuredBytes: 353935
    allocatedGiB: 1
    uid: 1000
    gid: 65534
  sourceCommandArgumentsRequireReview: false
  launchSecretKeys: []
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: vaultwarden
    namespace: vaultwarden
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: vaultwarden
    template:
      metadata:
        labels:
          app: vaultwarden
        annotations: {}
      spec:
        containers:
        - name: vaultwarden
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p80-tcp
            containerPort: 80
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /data
            readOnly: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          env: []
          imagePullPolicy: IfNotPresent
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: vaultwarden-data-0
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: vaultwarden-data-0
    namespace: vaultwarden
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: vaultwarden
    namespace: vaultwarden
  spec:
    selector:
      app: vaultwarden
    ports:
    - name: p80-tcp
      port: 80
      targetPort: 80
      protocol: TCP
    type: ClusterIP
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: vaultwarden-http
    namespace: vaultwarden
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
  spec:
    ingressClassName: traefik
    rules:
    - host: vault.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: vaultwarden
              port:
                number: 80
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: vaultwarden-https
    namespace: vaultwarden
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
  spec:
    ingressClassName: traefik
    rules:
    - host: vault.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: vaultwarden
              port:
                number: 80
- apiVersion: v1
  kind: Service
  metadata:
    name: vaultwarden-published
    namespace: vaultwarden
    labels:
      app.kubernetes.io/managed-by: Helm
    annotations:
      meta.helm.sh/release-name: vaultwarden
      meta.helm.sh/release-namespace: vaultwarden
  spec:
    type: ClusterIP
    externalIPs:
    - 192.168.0.4
    - 192.168.0.5
    - 192.168.0.6
    selector:
      app: vaultwarden
    ports:
    - name: p8096-tcp
      port: 8096
      targetPort: 80
      protocol: TCP
