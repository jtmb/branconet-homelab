enabled: false
replicaCount: 0
image: pihole/pihole:latest@sha256:ee348529cea9601df86ad94d62a39cad26117e1eac9e82d8876aa0ec7fe1ba27
environmentSecret: pihole-runtime
migration:
  verified: false
  state: live-integration-review-pending
  sources:
  - pi_pihole
  requiredEnvironmentKeys:
  - DNSMASQ_LISTENING
  - DNSMASQ_USER
  - FTL_CMD
  - PATH
  - PIHOLE_DNS_
  - TZ
  - WEBPASSWORD
  storageSizingVerified: true
  nativeSecretsImported: false
  applicationChecksPassed: false
  dataCopies:
  - sourceHost: 192.168.0.5
    sourcePath: /mnt/container-program-files/dnsmasq.d
    destinationPVC: pihole-data-0
    mountPath: /etc/dnsmasq.d
    measuredBytes: 4144
    allocatedGiB: 1
    uid: 1000
    gid: 65534
  - sourceHost: 192.168.0.5
    sourcePath: /mnt/container-program-files/pihole
    destinationPVC: pihole-data-1
    mountPath: /etc/pihole
    measuredBytes: 1082836076
    allocatedGiB: 3
    uid: 1000
    gid: 1000
  sourceCommandArgumentsRequireReview: false
resources:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: pihole
    namespace: pihole
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: pihole
    template:
      metadata:
        labels:
          app: pihole
        annotations: {}
      spec:
        containers:
        - name: pihole
          image: '{{ .Values.image }}'
          envFrom:
          - secretRef:
              name: '{{ .Values.environmentSecret }}'
          ports:
          - name: p53-tcp
            containerPort: 53
            protocol: TCP
          - name: p53-udp
            containerPort: 53
            protocol: UDP
          - name: p80-tcp
            containerPort: 80
            protocol: TCP
          volumeMounts:
          - name: data-0
            mountPath: /etc/dnsmasq.d
            readOnly: false
          - name: data-1
            mountPath: /etc/pihole
            readOnly: false
        volumes:
        - name: data-0
          persistentVolumeClaim:
            claimName: pihole-data-0
        - name: data-1
          persistentVolumeClaim:
            claimName: pihole-data-1
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: pihole-data-0
    namespace: pihole
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: pihole-data-1
    namespace: pihole
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 3Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: pihole
    namespace: pihole
  spec:
    selector:
      app: pihole
    ports:
    - name: p53-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: p53-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: p80-tcp
      port: 80
      targetPort: 80
      protocol: TCP
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: pihole
    namespace: pihole
  spec:
    ingressClassName: traefik
    rules:
    - host: pi.branconet.lan
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: pihole
              port:
                number: 53
