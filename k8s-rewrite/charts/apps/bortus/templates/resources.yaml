{{- if .Values.enabled }}
{{- if and (not .Values.migration.verified) (not .Values.migration.staging) }}
{{- fail "Migration storage, secrets and cutover checks must be verified before activation" }}
{{- end }}
{{- range .Values.resources }}
{{- if and $.Values.migration.staging (or (eq .kind "Ingress") (eq .kind "IngressRoute") (and (eq .kind "Service") (hasKey .spec "type") (ne .spec.type "ClusterIP"))) }}
{{- fail "Unaccepted BORTUS staging must remain private to the cluster" }}
{{- end }}
{{- if or (eq .kind "Deployment") (eq .kind "StatefulSet") }}
{{- $_ := set .spec "replicas" (int $.Values.replicaCount) }}
{{- end }}
---
{{ tpl (toYaml .) $ }}
{{- end }}
{{- end }}
