enabled: false
replicaCount: 0
image: bortus:migration-1438b27
environmentSecret: bortus-runtime
migration:
  verified: false
  state: delivered-image-live-acceptance-pending
  sources:
  - repository/BORTUS
  requiredEnvironmentKeys: []
  storageSizingVerified: false
  nativeSecretsImported: false
  applicationChecksPassed: false
  sourceCommit: 1438b278cdf21e98429b4836c018636b01b982a3
  secretNamespaces:
  - bortus
  - bortus-secrets
  - default
  - flux-system
  - games
  - homepage
  - http-echo
  - longhorn-system
  - mealie
  - pihole
  - plex
  - ruckus
  - traefik
  - vaultwarden
  - web-apps
  - website-stack
  - whoami
  - wordpress
  dashboardRBACReviewPending: false
  newPersistentNonsecretDatabase: Existing operator/development databases remain retained;
    this first cluster deployment uses a new PVC. Never reset an existing production
    database.
resources:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: bortus
    namespace: bortus
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: bortus-data
    namespace: bortus
    annotations:
      helm.sh/resource-policy: keep
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: bortus
    namespace: bortus
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels: &id001
        app: bortus
    template:
      metadata:
        labels: *id001
      spec:
        serviceAccountName: bortus
        securityContext:
          fsGroup: 1000
        containers:
        - name: bortus
          image: '{{ .Values.image }}'
          imagePullPolicy: Never
          ports:
          - name: http
            containerPort: 4000
          env:
          - name: DATABASE_URL
            value: file:/data/bortus.db
          - name: BOTRUS_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: bortus-runtime
                key: jwt-secret
          - name: BOTRUS_SECRETS_KEY
            valueFrom:
              secretKeyRef:
                name: bortus-runtime
                key: lookup-token
          - name: BORTUS_SECRET_NAMESPACES
            value: bortus,bortus-secrets,default,flux-system,games,homepage,http-echo,longhorn-system,mealie,pihole,plex,ruckus,traefik,vaultwarden,web-apps,website-stack,whoami,wordpress
          - name: BORTUS_SECRET_ALIASES_FILE
            value: /etc/bortus/aliases.json
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
          - name: data
            mountPath: /data
          - name: aliases
            mountPath: /etc/bortus
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bortus-data
        - name: aliases
          configMap:
            name: bortus-secret-aliases
- apiVersion: v1
  kind: Service
  metadata:
    name: bortus
    namespace: bortus
  spec:
    selector: *id001
    ports:
    - name: http
      port: 4000
      targetPort: 4000
    type: ClusterIP
