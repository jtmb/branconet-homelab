- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: bortus-data
    namespace: bortus
  spec:
    storageClassName: longhorn
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: bortus
    namespace: bortus
  spec:
    replicas: 0
    strategy:
      type: Recreate
    selector:
      matchLabels: &id001
        app: bortus
    template:
      metadata:
        labels: *id001
      spec:
        serviceAccountName: bortus
        securityContext:
          fsGroup: 1000
        containers:
        - name: bortus
          image: '{{ .Values.image }}'
          imagePullPolicy: Never
          ports:
          - name: http
            containerPort: 4000
          env:
          - name: DATABASE_URL
            value: file:/data/bortus.db
          - name: BOTRUS_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: bortus-runtime
                key: jwt-secret
          - name: BOTRUS_SECRETS_KEY
            valueFrom:
              secretKeyRef:
                name: bortus-runtime
                key: lookup-token
          - name: BORTUS_SECRET_NAMESPACES
            value: bortus,bortus-secrets,default,flux-system,games,homepage,longhorn-system,mealie,pihole,plex,ruckus,vaultwarden,web-apps,whoami,wordpress
          - name: BORTUS_SECRET_ALIASES_FILE
            value: /etc/bortus/aliases.json
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 4000
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
          - name: data
            mountPath: /data
          - name: aliases
            mountPath: /etc/bortus
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bortus-data
        - name: aliases
          configMap:
            name: bortus-secret-aliases
- apiVersion: v1
  kind: Service
  metadata:
    name: bortus
    namespace: bortus
  spec:
    selector: *id001
    ports:
    - name: http
      port: 4000
      targetPort: 4000
