# Homepage Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployment

---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
# Homepage Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
        branconet.io/type: system
        homepage.group: Apps
        homepage.name: Homepage
        homepage.icon: "https://github.com/gethomepage/homepage/blob/main/images/banner_light@2x.png?raw=true"
        homepage.href: "http://homepage.branconet.local/"
        homepage.description: Dashboard for all services
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "homepage.branconet.local"
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: docker-socket
          mountPath: /var/run/docker.sock
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
      volumes:
      - name: config
        emptyDir: {}
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
---
# Homepage Service
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: homepage
---
# Homepage Persistent Volume Claim (Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-config-pvc
  namespace: homepage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: longhorn
---
# Traefik Ingress Route for Homepage
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingress
  namespace: homepage
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`homepage.branconet.local`)
    kind: Service
    services:
    - name: homepage
      port: 3000
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""