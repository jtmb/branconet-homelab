# Monitoring Stack Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployments
# Services: Prometheus, Loki, Grafana, Uptime Kuma, Node Exporter

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-stack
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-stack
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        homepage.group: Monitoring
        homepage.name: Prometheus
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Prometheus_software_logo.svg/2066px-Prometheus_software_logo.svg.png"
        homepage.href: "http://prometheus.branconet.local/"
        homepage.description: Prometheus logs
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.0
        user: "0"
        command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 4Gi
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-stack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring-stack
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  selector:
    app: prometheus
---
# Loki Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring-stack
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        homepage.group: Monitoring
        homepage.name: Loki
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/0/07/Grafana_loki_logo.png"
        homepage.href: "http://loki.branconet.local/"
        homepage.description: Loki logs
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.4
        user: "0"
        command:
        - '-config.file=/etc/loki/loki-config.yml'
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
          readOnly: true
        - name: data
          mountPath: /data/loki
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 2Gi
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
# Loki ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring-stack
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /data/loki/chunks
          rules_directory: /data/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    ruler:
      storage:
        type: remote
      ring:
        size: 10737418240
      query_range:
        results_cache:
          cache_backend: inmemory
    limits_config:
      retention_period: 168h
      max_out_of_order_time: 32m
      max_line_size: 8kB
      max_object_size: 10MB
      chunk_target_size: 1MB
      chunk_retention_period: 168h
    analytics:
      reporting_enabled: false
---
# Loki Service
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring-stack
spec:
  type: ClusterIP
  ports:
  - port: 3100
    targetPort: 3100
    name: http
  selector:
    app: loki
---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring-stack
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        homepage.group: Monitoring
        homepage.name: Grafana
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Grafana_logo.svg/1200px-Grafana_logo.svg.png"
        homepage.href: "http://grafana.branconet.local/"
        homepage.description: Grafana timeseries dashboards
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.0.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: data
        emptyDir: {}
---
# Grafana ConfigMap for Datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-stack
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: true
---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring-stack
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: grafana
---
# Uptime Kuma Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring-stack
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
        homepage.group: Monitoring
        homepage.name: Uptime Kuma
        homepage.icon: "https://static-00.iconduck.com/assets.00/uptime-kuma-icon-2048x1892-iigw6pmz.png"
        homepage.href: "http://uptime.branconet.local/"
        homepage.description: Uptime monitoring
    spec:
      containers:
      - name: uptime-kuma
        image: louislam/uptime-kuma:1.25.0
        ports:
        - containerPort: 3001
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: data
        emptyDir: {}
---
# Uptime Kuma Service
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring-stack
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: uptime-kuma
---
# Node Exporter DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-stack
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
        homepage.group: Monitoring
        homepage.name: Node Exporter
        homepage.icon: "https://www.stackhero.io/assets/src/images/servicesLogos/openGraphVersions/prometheus.png?552669da"
        homepage.href: "http://node.branconet.local/"
        homepage.description: Node exporter
    spec:
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.6.1
        ports:
        - containerPort: 9100
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: rootfs
          mountPath: /host/rootfs
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: rootfs
        hostPath:
          path: /
---
# Node Exporter Service
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring-stack
spec:
  type: ClusterIP
  ports:
  - port: 9100
    targetPort: 9100
    name: http
  selector:
    app: node-exporter
---
# Traefik Ingress Routes for Monitoring Stack Services
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring-stack-ingress
  namespace: monitoring-stack
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`prometheus.branconet.local`)
    kind: Service
    services:
    - name: prometheus
      port: 9090
  - match: Host(`loki.branconet.local`)
    kind: Service
    services:
    - name: loki
      port: 3100
  - match: Host(`grafana.branconet.local`)
    kind: Service
    services:
    - name: grafana
      port: 3000
  - match: Host(`uptime.branconet.local`)
    kind: Service
    services:
    - name: uptime-kuma
      port: 3001
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""