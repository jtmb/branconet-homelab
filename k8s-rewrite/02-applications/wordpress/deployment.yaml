# WordPress Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployments
# Services: WordPress app, MySQL database, Redis cache, phpMyAdmin

---
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
# WordPress App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wp-app
  namespace: wordpress
  labels:
    app: wp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wp-app
  template:
    metadata:
      labels:
        app: wp-app
        homepage.group: WP
        homepage.name: WordPress
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/9/93/Wordpress_Blue_logo.png"
        homepage.href: "http://${domain_name}/"
        homepage.description: WordPress application
    spec:
      containers:
      - name: wordpress
        image: wordpress:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: wp-db-credentials
              key: host
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: wp-db-credentials
              key: user
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wp-db-credentials
              key: password
        - name: WORDPRESS_DB_NAME
          value: "wp_db"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - name: html
          mountPath: /var/www/html
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
---
# WordPress App Service
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: wp-app
---
# MySQL Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: wordpress
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        homepage.group: WP
        homepage.name: MySQL DB
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Database-mysql.svg/1448px-Database-mysql.svg.png"
        homepage.description: MySQL Database
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_DATABASE
          value: "wp_db"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: wp-db-credentials
              key: user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wp-db-credentials
              key: password
        - name: MYSQL_RANDOM_ROOT_PASSWORD
          value: "1"
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 2Gi
---
# MySQL Database Service
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: wordpress
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: db
---
# MySQL Persistent Volume Claim (Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-db-pvc
  namespace: wordpress
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# Redis Cache Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-db
  namespace: wordpress
  labels:
    app: redis-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
# Redis Cache Service
apiVersion: v1
kind: Service
metadata:
  name: redis-db
  namespace: wordpress
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis-db
---
# phpMyAdmin Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: wordpress
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
        homepage.group: WP
        homepage.name: phpMyAdmin
        homepage.icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/PhpMyAdmin_logo.svg/2560px-PhpMyAdmin_logo.svg.png"
        homepage.href: "http://${master_node}:8086/"
        homepage.description: Database Table browser
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PMA_HOST
          value: "db"
        - name: PMA_PORT
          value: "3306"
        - name: PMA_ARBITRARY
          value: "1"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
      # Note: phpMyAdmin connects to MySQL service directly, no volume needed for basic use
---
# phpMyAdmin Service
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: wordpress
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: phpmyadmin
---
# Traefik Ingress Route for WordPress
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: wordpress-ingress
  namespace: wordpress
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`${domain_name}`,`${env}.${domain_name}`)
    kind: Service
    services:
    - name: wordpress
      port: 80
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""
---
# Traefik Ingress Route for phpMyAdmin
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: phpmyadmin-ingress
  namespace: wordpress
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`phpmyadmin.branconet.local`)
    kind: Service
    services:
    - name: phpmyadmin
      port: 80
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""