# Discord Bots Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployment
# Service: Ruckus Discord Bot

---
apiVersion: v1
kind: Namespace
metadata:
  name: discord-bots
---
# Ruckus Discord Bot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruckus
  namespace: discord-bots
  labels:
    app: ruckus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruckus
  template:
    metadata:
      labels:
        app: ruckus
        branconet.io/type: system
    spec:
      containers:
      - name: ruckus
        image: ruckusbot/ruckus:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: ruckus-discord-token
              key: token
        - name: PREFIX
          value: "!"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
---
# Ruckus Discord Bot Service
apiVersion: v1
kind: Service
metadata:
  name: ruckus
  namespace: discord-bots
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: ruckus
---
# Traefik Ingress Route for Ruckus (optional - Discord bots typically don't need public access)
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: ruckus-ingress
  namespace: discord-bots
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`ruckus.branconet.local`)
    kind: Service
    services:
    - name: ruckus
      port: 80
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""