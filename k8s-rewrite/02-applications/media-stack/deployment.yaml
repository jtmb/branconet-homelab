# Unpackerr Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media-stack
  labels:
    app: unpackerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
        branconet.io/type: system
    spec:
      containers:
      - name: unpackerr
        image: golift/unpackerr:latest
        env:
        - name: UN_SONARR_0_URL
          value: "http://sonarr:8989"
        - name: UN_SONARR_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unpackerr-api-key
              key: api-key
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
---
# Unpackerr Service
apiVersion: v1
kind: Service
metadata:
  name: unpackerr
  namespace: media-stack
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: unpackerr
---
