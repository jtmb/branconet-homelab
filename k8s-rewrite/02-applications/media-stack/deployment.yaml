# Media Stack Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployments
# Services: Radarr, Sonarr, Bazarr, Overseerr, Tautulli, Jackett, Unpackerr, Flaresolverr, YouTube Downloader

---
apiVersion: v1
kind: Namespace
metadata:
  name: media-stack
---
# Radarr Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media-stack
  labels:
    app: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
        branconet.io/type: system
        homepage.group: Media
        homepage.name: Radarr
        homepage.icon: "https://i0.wp.com/devildogtech.com/wp-content/uploads/2022/10/radarr.png?resize=280%2C280&ssl=1"
        homepage.href: "http://radarr.branconet.local/"
        homepage.description: Radarr movie fetching and monitoring
    spec:
      containers:
      - name: radarr
        image: linuxserver/radarr:latest
        ports:
        - containerPort: 7878
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: movies
          mountPath: /media/movies
        - name: downloads
          mountPath: /downloads
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
# Radarr Service
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media-stack
spec:
  type: ClusterIP
  ports:
  - port: 7878
    targetPort: 7878
    name: http
  selector:
    app: radarr
---
# Sonarr Deployment
apiVersion: apps/v1
