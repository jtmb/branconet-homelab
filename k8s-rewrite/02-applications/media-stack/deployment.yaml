        homepage.href: "http://sonarr.branconet.local/"
        homepage.description: Sonarr TV series fetching and monitoring
    spec:
      containers:
      - name: sonarr
        image: linuxserver/sonarr:latest
        ports:
        - containerPort: 8989
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: tv
          mountPath: /media/tv
        - name: downloads
          mountPath: /downloads
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
