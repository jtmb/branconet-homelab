---
# YouTube Downloader (Metube) Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytdl
  namespace: media-stack
  labels:
    app: ytdl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ytdl
  template:
    metadata:
      labels:
        app: ytdl
        branconet.io/type: system
        homepage.group: Media
        homepage.name: Youtube Downloader
        homepage.icon: "https://res.cloudinary.com/razordarkamg/image/upload/v1621212884/SonarrV3_pufacd.png"
        homepage.href: "http://ytdl.branconet.local/"
        homepage.description: YouTube video downloader
    spec:
      containers:
      - name: ytdl
        image: ghcr.io/alexta69/metube:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: TEMP_DIR
          value: "/tmp_dir"
        - name: DELETE_FILE_ON_TRASHCAN
          value: "true"
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        - name: tmp_dir
          mountPath: /tmp_dir
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
---
# YouTube Downloader Service
apiVersion: v1
kind: Service
metadata:
  name: ytdl
  namespace: media-stack
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  selector:
    app: ytdl
---
# Persistent Volume Claim for Config (Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-config-pvc
  namespace: media-stack
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# Persistent Volume Claim for Movies (NFS or Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-movies-pvc
  namespace: media-stack
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # Use NFS for shared media storage, or Longhorn if preferred
  # storageClassName: longhorn
---
# Persistent Volume Claim for TV Shows (NFS or Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-tv-pvc
  namespace: media-stack
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # Use NFS for shared media storage, or Longhorn if preferred
  # storageClassName: longhorn
---
# Persistent Volume Claim for Downloads (NFS or Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-pvc
  namespace: media-stack
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # Use NFS for shared downloads storage, or Longhorn if preferred
  # storageClassName: longhorn
---
# Persistent Volume Claim for Temp Directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ytdl-tmp-pvc
  namespace: media-stack
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
# Traefik Ingress Routes for Media Stack Services
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: media-stack-ingress
  namespace: media-stack
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`radarr.branconet.local`)
    kind: Service
    services:
    - name: radarr
      port: 7878
  - match: Host(`sonarr.branconet.local`)
    kind: Service
    services:
    - name: sonarr
      port: 8989
  - match: Host(`bazarr.branconet.local`)
    kind: Service
    services:
    - name: bazarr
      port: 6767
  - match: Host(`overseerr.branconet.local`)
    kind: Service
    services:
    - name: overseerr
      port: 5055
  - match: Host(`tautulli.branconet.local`)
    kind: Service
    services:
    - name: tautulli
      port: 8181
  - match: Host(`jackett.branconet.local`)
    kind: Service
    services:
    - name: jackett
      port: 9117
  - match: Host(`ytdl.branconet.local`)
    kind: Service
    services:
    - name: ytdl
      port: 8081
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""