# Home Assistant Deployment
# Converts from Docker Swarm docker-compose.yml to Kubernetes Deployment

---
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
---
# Home Assistant Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
        branconet.io/type: system
        homepage.group: Apps
        homepage.name: Home Assistant
        homepage.icon: "https://community-assets.home-assistant.io/original/4X/1/3/8/13882a481a57f91f670def0fc33cf99d09dec293.png"
        homepage.href: "http://ha.branconet.local/"
        homepage.description: Home Assistant dashboard
    spec:
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
          name: http
        env:
        - name: TZ
          value: "America/Toronto"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      securityContext:
        runAsUser: 0
---
# Home Assistant Service
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  type: ClusterIP
  ports:
  - port: 8123
    targetPort: 8123
    name: http
  selector:
    app: home-assistant
---
# Home Assistant Persistent Volume Claim (Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config-pvc
  namespace: home-assistant
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
# Traefik Ingress Route for Home Assistant
apiVersion: traefik.containo.dev/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant-ingress
  namespace: home-assistant
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`ha.branconet.local`)
    kind: Service
    services:
    - name: home-assistant
      port: 8123
  middlewares:
  - name: tls-redirect
    passHostHeader: true
    stripPrefix:
      prefixMatch: ""