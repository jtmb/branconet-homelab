name: BORTUS application quality
on:
  pull_request:
    paths: ['k8s-rewrite/front-end/**', '.github/workflows/bortus-quality.yml']
  push:
    paths: ['k8s-rewrite/front-end/**', '.github/workflows/bortus-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bortus-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k8s-rewrite/front-end
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: file:./ci.db
      BOTRUS_JWT_SECRET: synthetic-ci-signing-material-only
      BOTRUS_SECRETS_KEY: synthetic-ci-lookup-material-only
      BORTUS_DISABLE_PROVISIONING: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: k8s-rewrite/front-end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
