apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-ingress-dns
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.252/32
    - 192.168.0.253/32
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-ingress-dns
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-ingress-dns
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-lan
  namespace: traefik
  annotations:
    metallb.io/address-pool: lan-ingress-dns
    metallb.io/loadBalancerIPs: "192.168.0.252"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-lan-dns
  namespace: pihole
  annotations:
    metallb.io/address-pool: lan-ingress-dns
    metallb.io/loadBalancerIPs: "192.168.0.253"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    lan-dns-serving: "true"
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
