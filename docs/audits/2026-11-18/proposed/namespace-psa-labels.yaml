# Proposed Pod Security labels for application namespaces. `baseline` is the
# safe first step; move to `restricted` per namespace once image security
# contexts allow it. Read-only object today; apply with kubectl label or the
# chart that owns the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: REPLACE_ME
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
